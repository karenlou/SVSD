<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Film Cut View</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Courier+Prime:wght@400;700&display=swap">
<style>
/* Film cut: the locked reel is the main surface. Every cue sits at its moment on the film, in a lane for its kind of sound; the script around the cue at the playhead shows underneath and unfolds, like a folded sheet of paper, into the full script over the reel. */
:root{
  --background:#f1efeb; --score-bg:#e8e5df; --foreground:#0c0a09; --card:#ffffff; --card-foreground:#0c0a09; --popover:#ffffff;
  --primary:#1c1917; --primary-foreground:#fafaf9; --secondary:#f5f3f0; --muted:#f5f3f0; --muted-foreground:#78716c;
  --accent:#f3f1ed; --border:#e5e2dd; --input:#e2ded8; --ring:#a1a1a1; --well:#0a0a0a; --well-fg:#fafafa;
  --radius:.625rem; --link:#2b8ff0;
  --ambience:#7f9460; --footsteps:#c2643f; --props:#d69726; --cloth:#cf7f8b; --hardfx:#e0552b; --score:#8a5a7e;
  --shadow-sm:0 1px 2px rgba(0,0,0,.05); --shadow-md:0 4px 6px -1px rgba(0,0,0,.1),0 2px 4px -2px rgba(0,0,0,.1);
  --f-sans:"Geist",ui-sans-serif,system-ui,-apple-system,sans-serif; --f-mono:"Geist Mono",ui-monospace,Menlo,monospace;
  --f-script:"Courier Prime","Courier New",Courier,monospace;
}
*{box-sizing:border-box}
body{background:var(--background);color:var(--foreground);font-family:var(--f-sans);font-size:14px;line-height:20px;-webkit-font-smoothing:antialiased;
  min-height:100dvh;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 16px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
canvas.g{display:block;flex:none}
.wrap{max-width:1120px;width:100%;margin:0 auto;flex:1;min-height:0;display:flex;flex-direction:column;gap:20px}

/* header */
header.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding-block:14px;border-bottom:1px solid var(--border);
  font:500 11px/16px var(--f-mono);letter-spacing:.08em;text-transform:uppercase}
.brand{display:flex;align-items:center;gap:10px;color:var(--foreground)}
.crumb{color:var(--muted-foreground)}
.nav{display:flex;gap:4px}
.nav button{border:0;background:none;cursor:pointer;padding:4px 10px;font:inherit;letter-spacing:inherit;text-transform:inherit;color:var(--muted-foreground);white-space:pre}
.nav button:hover{color:var(--foreground)}
.nav button[aria-selected="true"]{color:var(--foreground)}
.nav button[aria-selected="true"]::before{content:"[ "}.nav button[aria-selected="true"]::after{content:" ]"}
.meta{justify-self:end;display:flex;gap:16px;color:var(--muted-foreground)}
.meta b{font-weight:500;color:var(--foreground)}
.scr{display:inline-block}
@media (max-width:760px){header.top{grid-template-columns:1fr auto}.meta>span{display:none}}

/* shadcn: Button */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:calc(var(--radius) - 2px);font-size:13px;font-weight:500;cursor:pointer;border:1px solid transparent;white-space:nowrap;transition:background .15s,opacity .15s}
.btn svg{width:14px;height:14px}
.btn-default{background:var(--primary);color:var(--primary-foreground)}
.btn-default:hover{opacity:.9}
.btn-outline{background:var(--background);border-color:var(--input);box-shadow:var(--shadow-sm)}
.btn-outline:hover{background:var(--accent)}
.btn-ghost{background:transparent}
.btn-ghost:hover{background:var(--accent)}
.btn-icon{width:32px;padding:0}
.btn:disabled{opacity:.5;pointer-events:none}

/* shadcn: Badge */
.badge{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:calc(var(--radius) - 4px);padding:1px 8px;font-size:12px;font-weight:500;line-height:18px;white-space:nowrap}
.badge i{width:6px;height:6px;border-radius:50%;background:var(--c)}

/* shadcn: ToggleGroup */
.toggles{display:flex;flex-wrap:wrap;gap:2px}
.tg{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;height:28px;padding:0 9px;border-radius:calc(var(--radius) - 2px);font-size:12.5px;font-weight:500;cursor:pointer;color:var(--muted-foreground);transition:background .15s,color .15s}
.tg:hover{color:var(--foreground)}
.tg[aria-pressed="true"]{background:var(--accent);color:var(--foreground)}
.tg i{width:6px;height:6px;border-radius:50%;background:var(--c)}
.tg b{font:400 11px var(--f-mono);color:var(--muted-foreground);opacity:.8}
.hint{color:var(--muted-foreground);font-size:13px}

/* shadcn: Card */
.card{background:var(--card);color:var(--card-foreground);border:1px solid var(--border);border-radius:calc(var(--radius) + 4px);box-shadow:var(--shadow-sm)}
.card-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 16px;padding:16px 20px 0}
.card-t{font-weight:600;font-size:14px;line-height:20px}
.card-d{color:var(--muted-foreground);font-size:13px}
/* shadcn: Tooltip */
.tip{position:fixed;z-index:50;pointer-events:none;background:var(--primary);color:var(--primary-foreground);font-size:12px;line-height:16px;border-radius:calc(var(--radius) - 2px);padding:6px 10px;white-space:nowrap;transform:translate(-50%,-100%);margin-top:-10px;animation:tipin .12s ease-out}
@keyframes tipin{from{opacity:0;transform:translate(-50%,-90%)}}

/* script card: fixed height down to the bottom of the screen, scrolls inside */
.script{flex:1 1 0;min-height:420px;display:flex;flex-direction:row;gap:20px;min-width:0}
.pane{flex:1;min-width:0;position:relative;display:flex;flex-direction:column;border:1px solid var(--border);border-radius:3px;overflow:hidden}
.pane::after{content:"";position:absolute;left:0;right:0;bottom:0;height:88px;pointer-events:none;z-index:6;background:linear-gradient(to bottom,transparent,var(--background) 85%)}
.scroller{flex:1;min-width:0;min-height:0;overflow-y:auto;overscroll-behavior:contain;position:relative;scrollbar-width:thin;scrollbar-color:var(--input) transparent}
.doc{padding:0 0 96px}
.act{position:relative}
.act-h{position:sticky;top:0;z-index:5;display:flex;align-items:center;flex-wrap:wrap;gap:4px 14px;padding:11px 20px;width:100%;border:0;text-align:left;cursor:pointer;
  background:color-mix(in srgb,var(--background) 97%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);font:500 11px/16px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted-foreground)}
.act-h:hover{background:color-mix(in srgb,var(--accent) 92%,transparent)}
.act-h .chev{width:14px;height:14px;flex:none;color:var(--muted-foreground);transition:transform .25s cubic-bezier(.22,1,.36,1)}
.act.collapsed .chev{transform:rotate(-90deg)}
.act-body{display:grid;grid-template-rows:1fr;transition:grid-template-rows .3s cubic-bezier(.22,1,.36,1)}
.act-body>.inner{overflow:hidden;min-height:0}
.act.collapsed .act-body{grid-template-rows:0fr;visibility:hidden;transition:grid-template-rows .3s cubic-bezier(.22,1,.36,1),visibility 0s .3s}
.act-h .nm{color:var(--foreground);font-weight:600;display:flex;align-items:center;gap:8px}
.act-h .nm i{width:6px;height:6px;border-radius:1px;background:var(--foreground)}
.act-h .bd{letter-spacing:.04em}
.act-h .at{margin-left:auto;color:var(--foreground)}
.row{position:relative;display:grid;grid-template-columns:64px minmax(0,1fr)}
.gut{position:relative}
.scene-no{position:absolute;right:12px;top:22px;text-align:right;font:500 13px var(--f-mono);color:var(--muted-foreground)}
.page{padding:0 40px;font-family:var(--f-script);font-size:15px;line-height:28px;transition:opacity .35s}
.page p{margin:0;padding-bottom:20px}
.page .slug{font-weight:700;letter-spacing:.03em;padding-top:20px}
.page .sub{font-weight:700;padding-top:0}
.page .char{padding:4px 0 0 32%;padding-bottom:0}
.page .line{padding:0 16% 20px 20%}
.ci{display:grid;grid-template-columns:20px 1fr;align-items:center;gap:10px;border:0;background:transparent;text-align:left;cursor:pointer;border-radius:calc(var(--radius) - 2px);padding:6px 8px;transition:background .15s,opacity .3s}
.ci:hover,.ci.hot,.ci.open{background:var(--accent)}
.cuelist{width:240px;flex:none;display:flex;flex-direction:column;min-height:0}
.cuelist-h{padding:11px 8px;border-bottom:1px solid var(--border);font:500 11px/16px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted-foreground)}
.cl-scroll{flex:1;min-height:0;position:relative;overflow-y:auto;scrollbar-width:none;padding-top:8px;-webkit-mask-image:linear-gradient(to bottom,transparent,#000 18px,#000 calc(100% - 64px),transparent);mask-image:linear-gradient(to bottom,transparent,#000 18px,#000 calc(100% - 64px),transparent)}
.ci .lbl{font-size:13px;font-weight:500;line-height:18px;min-width:0}
.ci .cat{display:block;font-size:12px;font-weight:400;color:var(--muted-foreground)}
/* highlight */
.cue{cursor:pointer;border-radius:3px;-webkit-box-decoration-break:clone;box-decoration-break:clone;
  background-image:linear-gradient(90deg,transparent 0%,color-mix(in srgb,var(--c) 10%,transparent) 35%,color-mix(in srgb,var(--c) 38%,transparent) 100%),
    linear-gradient(90deg,color-mix(in srgb,var(--c) 10%,transparent),color-mix(in srgb,var(--c) 55%,transparent));
  background-repeat:no-repeat;background-position:0 0,0 100%;background-size:0% 100%,100% 1px;
  transition:background-size .55s cubic-bezier(.22,1,.36,1),color .2s}
.cue.hot,.doc.filtering .cue.match{background-size:100% 100%,100% 1px}
.pop .panel{background:var(--popover);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-md);overflow:hidden}
/* clip thumbnail: always the first thing in the card */
.clipslot{position:relative;aspect-ratio:16/9;max-width:100%;margin:6px 6px 0;background:#000;border-radius:calc(var(--radius) - 3px);overflow:hidden}
.clipslot .media{position:absolute;inset:0}
.clipslot .media canvas,.clipslot .media video{display:block;width:100%;height:100%;object-fit:cover}
.cliptag{position:absolute;left:8px;top:8px;display:flex;align-items:center;gap:6px;font:400 10.5px/14px var(--f-mono);color:#e5e5e5;background:rgba(0,0,0,.55);padding:2px 7px;border-radius:4px;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
/* comment card, after the references: header, a thread joined by a line, an input with a round send button */
.av{flex:none;width:32px;height:32px;border-radius:50%;font-size:0;
  background:radial-gradient(circle,var(--c) 0 38%,transparent 44%) 0 0/4px 4px,radial-gradient(circle,color-mix(in srgb,var(--c) 60%,#000) 0 30%,transparent 36%) 2px 2px/4px 4px,color-mix(in srgb,var(--c) 40%,#fff)}
.pop .panel{border-radius:20px;box-shadow:0 14px 34px -12px rgba(0,0,0,.24),0 2px 6px rgba(0,0,0,.05)}
.pop .clipslot{border-radius:14px}
.ch{display:flex;align-items:center;gap:8px;padding:14px 10px 12px 18px;border-bottom:1px solid var(--border);background:color-mix(in srgb,var(--muted) 55%,var(--popover))}
.pop:not(.ext) .ch{margin-top:6px;border-top:1px solid var(--border)}
.ch .tt{flex:1;min-width:0}
.ch b{display:block;font-size:15px;font-weight:500;line-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch small{display:block;font:400 11px/16px var(--f-mono);color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch .btn-icon{width:30px;height:30px;flex:none;color:var(--muted-foreground)}
.ch .btn-icon svg{width:16px;height:16px}
.ch .bk{margin-left:-10px}
.stc{display:inline-flex;align-items:center;gap:5px;flex:none;height:26px;padding:0 9px;border:1px solid var(--border);border-radius:999px;background:var(--popover);font:500 12px var(--f-sans);color:var(--foreground);white-space:nowrap}
button.stc{cursor:pointer}button.stc:hover{background:var(--accent)}
.stc i{width:6px;height:6px;border-radius:50%;background:var(--c)}
.stc svg{width:12px;height:12px;color:var(--muted-foreground)}
.kh{flex:none;font:400 10.5px var(--f-mono);color:var(--muted-foreground);white-space:nowrap}
.cnote{all:unset;box-sizing:border-box;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;width:100%;padding:12px 18px 0;font:400 12.5px/19px var(--f-script);color:var(--muted-foreground);cursor:pointer}
.cnote[aria-expanded=true]{-webkit-line-clamp:unset}
.cnote b{font:500 11.5px var(--f-sans);color:var(--foreground);margin-right:6px}
.thread{padding:6px 18px 8px}
.msg{position:relative;display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;padding:12px 0}
.msg:has(+.msg:not(.sys))::before{content:"";position:absolute;left:15.25px;top:52px;bottom:-4px;width:1.5px;border-radius:1px;background:var(--border)}
.msg .who{display:flex;align-items:baseline;flex-wrap:wrap;gap:0 8px;font-size:14px;font-weight:600;line-height:20px}
.msg .who small{font-size:12.5px;font-weight:400;color:var(--muted-foreground)}
.msg p{margin:2px 0 0;font-size:14px;line-height:21px;color:color-mix(in srgb,var(--foreground) 78%,transparent);white-space:pre-wrap;overflow-wrap:anywhere}
.msg.sys{display:block;padding:6px 0;text-align:center;font-size:11.5px;color:var(--muted-foreground)}
.mention{color:var(--link);font-weight:500}
.rxs{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.rx{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;border:1px solid var(--border);border-radius:999px;background:transparent;font-size:12.5px;cursor:pointer}
.rx:hover{background:var(--accent)}
.rx[aria-pressed=true]{background:color-mix(in srgb,var(--link) 10%,transparent);border-color:color-mix(in srgb,var(--link) 45%,transparent)}
.rx b{font:400 11px var(--f-mono);color:var(--muted-foreground)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--border);background:transparent;border-radius:999px;padding:3px 9px;font:inherit;font-size:12px;color:var(--muted-foreground);cursor:pointer}
.chip i{width:6px;height:6px;border-radius:50%;background:var(--c)}
.chip:hover{background:var(--accent)}
.chip[aria-pressed=true]{background:var(--foreground);color:var(--background);border-color:var(--foreground)}
/* a new comment starts at the playhead; play or scrub on, then "Set end" makes it a range */
.rng{display:flex;align-items:center;gap:4px;padding:8px 12px 0 18px;border-top:1px solid var(--border);background:var(--popover);font:400 11.5px/24px var(--f-mono);color:var(--foreground)}
.rng+.compose{border-top:0}
.rng .btn{height:24px;padding:0 8px;font:400 12px var(--f-sans)}
.rng .btn-icon{width:24px;padding:0}.rng .btn svg{width:12px;height:12px}
.rng [data-act=setend]{margin-left:auto}
.rng [data-act=setend] b{margin-left:4px;font:500 11.5px var(--f-mono)}
.rng .btn:disabled{opacity:.45;pointer-events:none}
.compose{position:relative;padding:12px 12px 12px 18px;border-top:1px solid var(--border);background:var(--popover)}
.pend{margin-bottom:8px}.pend .hero.sm:first-child{margin-top:0}
.cin{display:flex;align-items:flex-end;gap:10px}
.cin .av{width:28px;height:28px;margin-bottom:2px}
.cin textarea{flex:1;min-width:0;min-height:32px;max-height:120px;padding:6px 0;border:0;outline:0;resize:none;background:transparent;color:inherit;font:inherit;font-size:14px;line-height:20px;caret-color:var(--link)}
.cin textarea::placeholder{color:var(--muted-foreground)}
.cin .btn{width:34px;height:34px;padding:0;border-radius:50%;flex:none}
.cin .btn svg{width:16px;height:16px}
.cin .mic{color:var(--muted-foreground)}
.cin .mic.rec{width:auto;padding:0 10px;border-radius:17px;background:#ef4444;color:#fff;font:500 11px var(--f-mono)}
.cin .send{background:var(--link);color:#fff}
.cin .send:hover{opacity:.9}
.clist{padding:6px 10px 8px}
.crow{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;padding:8px;border:0;border-radius:10px;background:transparent;text-align:left;font-size:13.5px;cursor:pointer}
.crow:hover{background:var(--accent)}
.crow .av{width:24px;height:24px}
.crow>span:nth-child(2){white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow small{display:flex;align-items:center;gap:6px;font:400 11px var(--f-mono);color:var(--muted-foreground)}

/* ---------- film cut: the reel is the main surface. Player on top, cue lanes under it, the script behind the current cue underneath ---------- */
@media (min-width:861px){body{height:100dvh}}
body{overflow-x:hidden}
.main{flex:1;min-height:0;display:flex;gap:0}
.vdiv{flex:1 1 auto;min-width:48px;display:flex;justify-content:center}
.vdiv::before{content:"";width:1px;background:var(--border)}
.col{position:relative;flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;gap:14px}
.player{flex:none;padding:14px 18px 10px;display:flex;flex-direction:column;gap:10px;transform-origin:50% 45%;
  transition:transform .6s cubic-bezier(.22,1,.36,1),opacity .5s ease,filter .5s ease}
.screen{position:relative;align-self:center;width:min(100%,560px);aspect-ratio:16/9;background:#000;border-radius:2px;overflow:hidden;cursor:pointer;flex:none}
.screen video{display:block;width:100%;height:100%;object-fit:contain;background:#000}
.screen .big{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;display:grid;place-items:center;pointer-events:none;opacity:0;transition:opacity .2s}
.screen.paused .big{opacity:1}
.screen .big svg{width:22px;height:22px}
.tp{min-width:0;display:flex;flex-direction:column;gap:4px}
.ctl{display:flex;align-items:center;gap:6px;min-width:0}
.ctl .tc{font:500 12px var(--f-mono);white-space:nowrap;margin-right:8px}
.ctl .now-sc{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:400 11px var(--f-mono);letter-spacing:.04em;color:var(--muted-foreground);text-transform:uppercase}
.btn svg{width:14px;height:14px}

/* the reel shrinks back into the screen while the script unfolds over it, and grows back out when the script folds away */
.player.recede{transform:scale(.78) translateY(-3%);opacity:0;filter:blur(3px)}
.player.nt{transition:none}
.expanded .player{position:absolute;left:0;right:0;top:0;pointer-events:none}
.expanded .player.recede{visibility:hidden;transition:transform .6s cubic-bezier(.22,1,.36,1),opacity .5s ease,filter .5s ease,visibility 0s .6s}
.sp.pre{visibility:hidden}

/* the paper: a tri-fold sheet. The middle third flies from the excerpt to the middle of the column, then the top flap unfolds up and the bottom flap down.
   Each flap shows the script on its front and plain paper on its back; a crease shadow deepens as it folds */
.sheet{position:fixed;z-index:40;pointer-events:none;transform-origin:50% 50%;transform-style:preserve-3d;perspective:2400px;
  transform:translate3d(var(--tx,0px),var(--ty,0px),0) scale(var(--s,1))}
.sheet .pnl{position:absolute;left:0;right:0;transform-style:preserve-3d}
.sheet .face{position:absolute;inset:0;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--background)}
.sheet .back{transform:rotateX(180deg);background:var(--card)}
.sheet .pnl.up{transform-origin:50% 100%;transform:translateZ(var(--z,0px)) rotateX(var(--a,0deg))}
.sheet .pnl.dn{transform-origin:50% 0;transform:translateZ(var(--z,0px)) rotateX(var(--a,0deg))}
.sheet .pnl.mid{z-index:1}
.sheet .pnl>.cr{position:absolute;left:0;right:0;height:30%;pointer-events:none;backface-visibility:hidden;-webkit-backface-visibility:hidden;opacity:var(--c,0)}
.sheet .pnl.up>.cr{bottom:0;background:linear-gradient(to top,rgba(60,48,30,.3),transparent)}
.sheet .pnl.dn>.cr{top:0;background:linear-gradient(to bottom,rgba(60,48,30,.3),transparent)}
.sheet .pnl.mid>.cr{display:none}
.sheet .exc{position:absolute;inset:0;pointer-events:none}
.sheet .cr{position:absolute;left:0;right:0;height:22%;pointer-events:none;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.sheet .clone{position:absolute;left:0;visibility:visible!important}

/* lanes: one thin lane per sound; each cue a stroke as long as the sound. The current (or hovered) cue shows its interval on the axis */
.ftl{position:relative;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none}
.ftl .ax{position:absolute;left:0;right:0;height:1px;background:color-mix(in srgb,var(--foreground) 22%,transparent);pointer-events:none}

  next:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4l4 4-4 4"/><path d="M12.5 4v8"/></svg>',
  unfold:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 5.5h11M2.5 10.5h11"/><path d="M5 3l3-1.5L11 3M5 13l3 1.5 3-1.5"/></svg>',
  x:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg>',

  down:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 6.5L8 10l3.5-3.5"/></svg>',
  check:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3L13 4.5"/></svg>',
  film:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><rect x="2.5" y="3.5" width="11" height="9" rx="1.5"/><path d="M5.5 3.5v9M10.5 3.5v9M2.5 6.5h3M2.5 9.5h3M10.5 6.5h3M10.5 9.5h3"/></svg>',
  send:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13V3.5M4 7.5l4-4 4 4"/></svg>'};

/* ---------- full script: every set, same as the script view. Sets on other reels start folded and their phrases aren't live here ---------- */
const doc=$("#doc"), order=[];
const parse=t=>t.replace(/\[\[(\w+)\|([^\]]+)\]\]/g,(_,id,txt)=>{order.push(id);return REEL[id]?`<span class="cue" tabindex="0" data-id="${id}" style="--c:var(--${CUES[id].c})">${txt}</span>`:`<span class="cue off" title="On another reel" style="--c:var(--${CUES[id].c})">${txt}</span>`});
doc.innerHTML=SCRIPT.map((act,ai)=>{
  const rows=[];
  act.scenes.forEach(sc=>{
    rows.push({gut:`<div class="scene-no">${sc.n}</div>`,page:`<p class="slug" data-scene="${sc.n}">${sc.slug}</p>`});
    sc.b.forEach(([t,txt])=>{const s=order.length,body=parse(txt),ids=order.slice(s);ids.forEach(id=>{CUES[id].scene=sc.n;CUES[id].act=ai});
      const cls=t==="a"?"":t==="t"?"sub":t==="c"?"char":"line",prev=rows[rows.length-1];
      if((t==="l")&&prev.dlg){prev.page+=`<p class="${cls}">${body}</p>`;return}
      rows.push({gut:"",page:`<p class="${cls}">${body}</p>`,dlg:t==="c"})});
  });
  return `<section class="act${act.reel?"":" collapsed"}" data-act="${ai}"${act.reel?" data-reel":""}><button class="act-h" aria-expanded="${!!act.reel}"><svg class="chev" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg><span class="nm"><i></i>${act.name}</span><span class="bd">${act.board}</span><span class="at">${act.reel?"This reel":"Other reels"}</span></button><div class="act-body"><div class="inner">`+
    rows.map(r=>`<div class="row"><div class="gut">${r.gut}</div><div class="page">${r.page}</div></div>`).join("")+`</div></div></section>`;
}).join("");
function toggleAct(sec,force){const c=force??!sec.classList.contains("collapsed");sec.classList.toggle("collapsed",c);sec.querySelector(".act-h").setAttribute("aria-expanded",String(!c))}

/* ---------- the film ---------- */
const FILM=Object.keys(REEL).sort((a,b)=>CUES[a].ft-CUES[b].ft),SCN=SCRIPT.find(a=>a.reel).scenes.map(sc=>({...sc,src:sc}));
const vid=$("#vid"),screen=$("#screen");let LEN=184.7;
vid.addEventListener("loadedmetadata",()=>{if(isFinite(vid.duration)){LEN=vid.duration;counts();renderTL()}});
const now=()=>vid.currentTime||0;
const sceneAt=t=>SCN.find(s=>t<s.e)||SCN[SCN.length-1];
function ownerAt(t){let o=FILM[0];for(const id of FILM)if(CUES[id].ft<=t+.01)o=id;return o}
const ppIcon=()=>{const p=!vid.paused&&!vid.ended;$("#pp").innerHTML=p?ICON.pause:ICON.play;$("#big").innerHTML=ICON.play;screen.classList.toggle("paused",!p);const z=$("#scard [data-act=pp]");if(z)z.innerHTML=p?ICON.pause:ICON.play};
["play","pause","ended"].forEach(e=>vid.addEventListener(e,ppIcon));
const play=()=>{if(vid.ended)vid.currentTime=0;vid.play().catch(()=>{})},pause=()=>vid.pause();
function seek(t){vid.currentTime=cl(t,0,LEN);update(cl(t,0,LEN))}
const toggle=()=>vid.paused||vid.ended?play():pause();
function step(d){const i=FILM.indexOf(cur);if(d<0&&now()-CUES[cur].ft>1.5)return seek(CUES[cur].ft);seek(CUES[FILM[cl(i+d,0,FILM.length-1)]].ft)}
const tcx=()=>$("#tcv")?.getContext("2d");
function loop(t){NOW=t/1000;for(const it of insts){if(!it.cv.isConnected){insts.delete(it);continue}draw(it)}
  update(now());if(EXP&&vid.readyState>=2){const c=tcx();if(c)c.drawImage(vid,0,0,480,270);trimTick()}
  requestAnimationFrame(loop)}

/* ---------- timeline: a thin lane per sound; the current (or hovered) cue's interval is marked on the axis and spelled out in its label ---------- */
const ftl=$("#ftl"),XP=t=>(t/LEN*100).toFixed(3)+"%";let AX=0;
function renderTL(){const W=ftl.clientWidth||800,px=t=>t/LEN*W,top=34,LH=8,cats=Object.keys(CATS).filter(c=>FILM.some(id=>CUES[id].c===c)),layer=cats.length*LH;AX=top+layer+6;
  let h=SCN.map(s=>`<div class="scb" style="left:${XP(s.s)};width:${XP(s.e-s.s)};top:${top-4}px;height:${AX-top+4}px"><span>SC ${s.n}</span></div>`).join("");
  h+=cats.map((c,i)=>`<div class="lnl" style="top:${top+i*LH+3}px"></div>`).join("");
  h+=`<div class="ax" style="top:${AX}px"></div>`;
  for(let t=0;t<=LEN;t+=5)h+=`<i class="tk${t%30?"":" l"}" style="left:${XP(t)};top:${AX}px">${t%30?"":`<b>${mmss(t)}</b>`}</i>`;
  h+=FILM.map(id=>{const q=CUES[id];return `<button class="fm${id===cur?" cur":""}" data-id="${id}" style="--c:var(--${q.c});left:${px(q.ft)}px;width:${Math.max(3,px(q.dur))}px;top:${top+cats.indexOf(q.c)*LH+3}px" aria-label="${span(q)} ${esc(q.n)}"></button>`}).join("");
  ftl.style.height=AX+22+"px";
  ftl.innerHTML=h+`<div class="rng-ax" id="crng" style="top:${AX}px"></div><div class="rng-ax hov" id="hrng" style="top:${AX}px" hidden></div><div class="flab" id="flab"></div><div class="fph" id="fph" style="top:${top-6}px;height:${AX-top+8}px"></div>`;
  placeLabel();applyFilter();lastT=-1;update(now())}
let tlW=0;new ResizeObserver(()=>{if(ftl.clientWidth!==tlW){tlW=ftl.clientWidth;renderTL()}}).observe(ftl);
function rngAt(el,q){el.style.setProperty("--c",`var(--${q.c})`);el.style.left=XP(q.ft);el.style.width=XP(q.dur)}
function placeLabel(){const l=$("#flab"),q=CUES[cur];if(!l||!q)return;l.innerHTML=`<b>${span(q)}</b>${esc(q.n)}<small>${secs(q.dur)}</small>`;l.style.left=XP(q.ft);l.classList.toggle("rt",q.ft>LEN*.6);rngAt($("#crng"),q)}
const tAt=e=>{const r=ftl.getBoundingClientRect();return cl((e.clientX-r.left)/r.width)*LEN};
let drag=null;
ftl.addEventListener("pointerdown",e=>{if(e.button)return;e.preventDefault();try{ftl.setPointerCapture(e.pointerId)}catch(_){};drag={x:e.clientX,id:e.target.closest(".fm")?.dataset.id,moved:false,was:!vid.paused};tip?.remove()});
ftl.addEventListener("pointermove",e=>{if(!drag)return;if(!drag.moved&&Math.abs(e.clientX-drag.x)<4)return;if(!drag.moved){drag.moved=true;if(drag.was)pause()}seek(tAt(e))});
ftl.addEventListener("pointerup",e=>{if(!drag)return;const d=drag;drag=null;if(d.moved){if(d.was)play();return}seek(d.id?CUES[d.id].ft:tAt(e))});
ftl.addEventListener("pointercancel",()=>{drag=null});

/* ---------- the current cue: list, lanes, excerpt, full script and its card all follow the playhead ---------- */
let cur=null,lastT=-1;
function update(t){if(t===lastT)return;lastT=t;const ph=$("#fph");if(!ph)return;ph.style.left=XP(t);$("#tc").textContent=`${tc(t)} / ${mmss(LEN)}`;
  const sc=sceneAt(t);$("#nowSc").textContent=`Sc ${sc.n} · ${sc.slug}`;setCur(ownerAt(t));draftTick(t)}
function setCur(id,force){if(!id||id===cur&&!force)return;const prev=cur;cur=id;const q=CUES[id];
  $$(".ci.in").forEach(x=>x.classList.remove("in"));$(`.ci[data-id="${id}"]`)?.classList.add("in");settleList();
  $$(".cm-i.in").forEach(x=>x.classList.remove("in"));$$(`.cm-i[data-id="${id}"]`).forEach(x=>x.classList.add("in"));
  $$(".fm.cur").forEach(x=>x.classList.remove("cur"));$(`.fm[data-id="${id}"]`)?.classList.add("cur");placeLabel();
  $$("#doc .now").forEach(x=>x.classList.remove("now"));anchorIn(doc)?.classList.add("now");
  if(prev&&RG[prev])setG(RG[prev],restKey(CUES[prev]),restColor);if(RG[id])setG(RG[id],"bud",`--${q.c}`);
  renderExcerpt();if(EXP&&!ANIM){follow();cardFollow()}}
const hideTools=()=>{hl.hidden=true;hideCtx()};

/* snippet: a copy of the script in a one-third-height window, kept centred on the current cue. It's re-copied whenever the script itself changes */
const exDoc=$("#exDoc");
function syncSnippet(){exDoc.innerHTML=doc.innerHTML;exDoc.scrollTop=0;centre(exDoc,$("#ex"),true)}
/* scroll a script copy so the current cue sits at the middle of box */
function anchorIn(root){return $(`.cue[data-id="${cur}"]`,root)}
function centre(sc,box,instant){const el=anchorIn(sc);if(!el)return;const sec=el.closest(".act");if(sec?.classList.contains("collapsed")){sec.classList.remove("collapsed")}
  const b=box.getBoundingClientRect(),r=el.getBoundingClientRect();if(!b.height)return;sc.scrollTo({top:sc.scrollTop+r.top+r.height/2-(b.top+b.height/2),behavior:instant||reduce?"auto":"smooth"})}
function renderExcerpt(){const q=CUES[cur];
  $$("#exDoc .now").forEach(x=>x.classList.remove("now"));anchorIn(exDoc)?.classList.add("now");
  $("#exChips").innerHTML=`<span class="chipx" style="--c:var(--${q.c})"><b>${span(q)}</b>${esc(q.n)}<i></i></span><span class="chipx open">Unfold script ${ICON.unfold}</span>`;
  if(!EXP&&!ANIM)centre(exDoc,$("#ex"))}
/* the column is split in thirds: the snippet takes one, the film card the rest, with the picture as large as fits */
function layoutFilm(){const col=$(".col"),narrow=innerWidth<=860,ch=col.clientHeight,H=narrow?220:Math.round(cl(ch*.22,150,230));
  document.documentElement.style.setProperty("--half",Math.round((narrow?innerHeight*.7:ch)/2)+"px");$("#ex").style.height=H+"px";
  if(narrow){col.style.width="";col.style.flex="";screen.style.width="100%";return}
  const other=player.offsetHeight-screen.offsetHeight,maxW=$(".main").clientWidth-$("#cuelist").offsetWidth-48,W=Math.round(Math.max(420,Math.min(maxW,(ch-H-14-other)*16/9)));
  col.style.flex="none";col.style.width=W+"px";screen.style.width=W+"px"}
new ResizeObserver(()=>{layoutFilm();if(!EXP)centre(exDoc,$("#ex"),true)}).observe($(".main"));

/* ---------- script view: the script unfolds over the reel like a tri-folded sheet of paper, and folds back into the excerpt on the way out ---------- */
let EXP=false,ANIM=false,manualAt=-1e9;const scard=$("#scard"),player=$("#player");
const easeIO=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2, seg=(t,a,d)=>cl((t-a)/d);
/* a sheet over rect T: the middle panel is the snippet (height Hs, centred), and above and below it n panels each, chained hinge to hinge.
   Every panel holds a copy of the script pane offset to show its own strip */
function buildSheet(T,Hs,top=doc.scrollTop){const sh=document.createElement("div"),sp=$("#sp"),y0=(T.height-Hs)/2,n=Math.max(1,Math.ceil(y0/Hs-1e-6)),sg=y0/n;sh.className="sheet";
  Object.assign(sh.style,{left:T.left+"px",top:T.top+"px",width:T.width+"px",height:T.height+"px"});
  const clone=y=>{const c=sp.cloneNode(true);c.querySelectorAll("[id]").forEach(e=>e.removeAttribute("id"));c.removeAttribute("id");c.hidden=false;c.classList.remove("pre");c.classList.add("clone");
    Object.assign(c.style,{top:-y+"px",width:T.width+"px",height:T.height+"px",display:"flex"});return c};
  const panel=(cls,t,h,y)=>{const el=document.createElement("div");el.className="pnl "+cls;Object.assign(el.style,{top:t+"px",height:h+"px"});el.innerHTML='<div class="face"></div><div class="cr"></div>';$(".face",el).appendChild(clone(y));return el};
  const ups=[],dns=[];let par=sh;
  for(let i=0;i<n;i++){const el=panel("up",i?-sg:y0-sg,sg,y0-sg*(i+1));par.appendChild(el);ups.push(el);par=el}
  par=sh;for(let i=0;i<n;i++){const el=panel("dn",i?sg:y0+Hs,sg,y0+Hs+sg*i);par.appendChild(el);dns.push(el);par=el}
  const mid=panel("mid",y0,Hs,y0);mid.insertAdjacentHTML("beforeend",'<div class="exc"></div>');sh.appendChild(mid);
  const ch=$("#exChips").cloneNode(true);ch.removeAttribute("id");$(".exc",mid).appendChild(ch);
  document.body.appendChild(sh);$$(".doc",sh).forEach(d=>d.scrollTop=top);return {sh,y0,ups,dns}}
/* f = how folded each panel is (1 folded, 0 flat). Folded, panels alternate 180 / -180 so the chain zig-zags behind the snippet; p = flight (0 at the snippet, 1 in place) */
function pose(S,A,T,p,fu,fd){const {sh,y0,ups,dns}=S,v=(el,k,x)=>el.style.setProperty(k,x);
  v(sh,"--tx",(A.left-T.left)*(1-p)+"px");v(sh,"--ty",(A.top-(T.top+y0))*(1-p)+"px");v(sh,"--s",1);
  const set=(el,i,f,sign)=>{const a=sign*(i%2?-1:1)*180*f;v(el,"--a",a+"deg");v(el,"--z",(i?(i%2?1:-1):-2)*f+"px");v(el,"--c",Math.sin(f*PI).toFixed(3))};
  ups.forEach((el,i)=>set(el,i,fu[i],1));dns.forEach((el,i)=>set(el,i,fd[i],-1));
  const ex=$(".exc",sh);if(ex)ex.style.opacity=Math.max(0,1-p*1.6)}
function run(dur,f){return new Promise(r=>{const t0=performance.now();(function fr(n){const t=Math.min(1,(n-t0)/dur);f(t*dur);t<1?requestAnimationFrame(fr):r()})(t0)})}
const FLY=420,STEP=190,TURN=360;
async function openScript(){if(EXP||ANIM)return;ANIM=true;EXP=true;tip?.remove();hideTools();
  const ex=$("#ex"),A=ex.getBoundingClientRect(),sp=$("#sp");
  player.classList.add("recede");document.body.classList.add("expanded");ex.hidden=true;sp.hidden=false;sp.classList.add("pre");manualAt=-1e9;follow(true);
  if(reduce){sp.classList.remove("pre");ANIM=false;cardFollow(true);return}
  const T=sp.getBoundingClientRect(),S=buildSheet(T,A.height),n=S.ups.length,ones=Array(n).fill(1);pose(S,A,T,0,ones,ones);
  /* order: the top chain from the snippet outwards, then the bottom chain */
  const at=k=>FLY-60+k*STEP,end=at(2*n-1)+TURN;
  await run(end,ms=>pose(S,A,T,easeIO(seg(ms,0,FLY)),S.ups.map((_,i)=>1-easeIO(seg(ms,at(i),TURN))),S.dns.map((_,i)=>1-easeIO(seg(ms,at(n+i),TURN)))));
  sp.classList.remove("pre");S.sh.remove();ANIM=false;cardFollow(true)}
async function closeScript(){if(!EXP||ANIM)return;ANIM=true;closeMenu();hideTools();scard.hidden=true;SC.free=false;
  const sp=$("#sp"),ex=$("#ex");manualAt=-1e9;follow(true);const T=sp.getBoundingClientRect(),top0=doc.scrollTop;
  syncSnippet();renderExcerpt();
  sp.hidden=true;EXP=false;player.classList.add("nt");document.body.classList.remove("expanded");ex.hidden=false;ex.classList.add("pre");player.offsetWidth;player.classList.remove("nt");
  layoutFilm();const A=ex.getBoundingClientRect();centre(exDoc,ex,true);
  const S=buildSheet(T,A.height,top0),n=S.ups.length,zeros=Array(n).fill(0);pose(S,T,T,1,zeros,zeros);
  if(reduce){S.sh.remove();player.classList.remove("recede");ex.classList.remove("pre");ANIM=false;return}
  /* reverse: the bottom chain folds in from its outer end, then the top chain, then the folded sheet drops into the snippet */
  const at=k=>k*STEP,fly=at(2*n-1)+TURN-80;setTimeout(()=>player.classList.remove("recede"),at(n));
  await run(fly+FLY,ms=>pose(S,A,T,1-easeIO(seg(ms,fly,FLY)),S.ups.map((_,i)=>easeIO(seg(ms,at(2*n-1-i),TURN))),S.dns.map((_,i)=>easeIO(seg(ms,at(n-1-i),TURN)))));
  ex.classList.remove("pre");S.sh.remove();ANIM=false}
/* the script view keeps the current cue at the middle of the page, where the snippet was */
function follow(instant){if(performance.now()-manualAt<3000||!hl.hidden||!ctx.hidden)return;centre(doc,$("#sp"),instant)}
["wheel","touchmove"].forEach(ev=>doc.addEventListener(ev,()=>manualAt=performance.now(),{passive:true}));
doc.addEventListener("click",e=>{const h=e.target.closest(".act-h");if(h){toggleAct(h.closest(".act"));return setTimeout(placeCard,320)}if(!getSelection().isCollapsed)return;
  const c=e.target.closest(".cue:not(.off)");if(c){manualAt=-1e9;const id=c.dataset.id;seek(CUES[id].ft);toCue(id)}});
doc.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.classList.contains("cue"))e.target.click()});
doc.addEventListener("scroll",()=>placeCard(),{passive:true});addEventListener("resize",()=>placeCard());
$("#ex").addEventListener("click",()=>openScript());
$("#close").addEventListener("click",closeScript);

/* ---------- script card: the cue's clip on top (click it to fold back to the film), then the cue (director's note, comments), a thread, or a new comment.
   A new comment starts at the playhead; play or scrub on, then "Set end" makes it a range. Status follows the script view: open → addressed (foley) → approved (director) ---------- */
const SC={id:null,mode:"cue",cid:null,draft:null,text:"",note:false};
const avHTML=k=>`<span class="av" style="--c:var(${PEOPLE[k].c})" title="${PEOPLE[k].n}" aria-label="${PEOPLE[k].n}"></span>`;
const statusActs=m=>ROLE==="foley"?(m.status==="open"?[["addressed","Mark addressed"]]:[]):m.status==="addressed"?[["approved","Approve"],["open","Reopen"]]:m.status==="approved"?[["open","Reopen"]]:[];
const cueActs=q=>ROLE==="director"?(q.s==="none"?[["approved","Approve cue"]]:[["none","Undo approval"]]):q.s==="approved"?[["recorded","Mark recorded"]]:q.s==="recorded"?[["approved","Not recorded yet"]]:[];
const CUEST={none:["Not approved","--muted-foreground"],approved:["To record","--props"],recorded:["Recorded","--ambience"]};
const chipHTML=(label,c,act,acts,wait)=>acts.length?`<button class="stc" data-act="${act}" style="--c:var(${c})" title="Change status"><i></i>${label}${ICON.down}</button>`:`<span class="stc" style="--c:var(${c})" title="${wait||""}"><i></i>${label}</span>`;
function cardFollow(force){if(!EXP||ANIM)return;if(SC.mode==="cue"&&!SC.text.trim()&&(SC.id!==cur||force)){SC.id=cur;renderCard()}else if(force)renderCard();placeCard()}
function toCue(id){SC.id=id||SC.id;SC.mode="cue";SC.cid=null;SC.draft=null;SC.text="";if(EXP)renderCard()}
function openThread(cid){const m=COMMENTS[cid];SC.id=m.clip;SC.mode="thread";SC.cid=cid;SC.draft=null;SC.text="";pause();seek(CUES[m.clip].ft+m.t0);renderCard()}
function openDraft(){const q=CUES[SC.id],t=cl(now()-q.ft,0,q.dur);pause();SC.mode="draft";SC.draft={t0:t,t1:null};renderCard(true)}
function headHTML(){const q=CUES[SC.id];
  if(SC.mode==="thread"){const m=COMMENTS[SC.cid];return `<div class="ch"><button class="btn btn-ghost btn-icon bk" data-act="back" aria-label="Back to cue">${ICON.back}</button><div class="tt"><b>${esc(q.n)}</b><small>${rangeTxt(m)} · ${CATS[m.cat]} · ${PRI[m.pri].n} priority</small></div>${chipHTML(STATUS[m.status].n,STATUS[m.status].c,"stmenu",statusActs(m),ROLE==="foley"?"Waiting on the director":"Waiting on the foley artist")}</div>`}
  if(SC.mode==="draft")return `<div class="ch"><button class="btn btn-ghost btn-icon bk" data-act="back" aria-label="Back to cue">${ICON.back}</button><div class="tt"><b>Add comment</b><small>${esc(q.n)} · ${CATS[q.c]}</small></div></div>`;
  return `<div class="ch"><div class="tt"><b>${esc(q.n)}</b><small>Scene ${q.scene} · ${CATS[q.c]} · ${span(q)}</small></div>${chipHTML(CUEST[q.s][0],CUEST[q.s][1],"cuemenu",cueActs(q),"Waiting on director approval")}</div>`}

/* ---------- filter by sound ---------- */
let curCat="all";
function renderBar(){const n={};FILM.forEach(id=>n[CUES[id].c]=(n[CUES[id].c]||0)+1);$("#bar").classList.toggle("filtering",curCat!=="all");
  $("#bar").innerHTML=Object.keys(CATS).filter(k=>n[k]).map(k=>`<button class="lg" data-cat="${k}" aria-pressed="${curCat===k}" title="${curCat===k?"Show all sounds":`Only ${CATS[k]} (${n[k]})`}" style="--c:var(--${k})"><i></i>${CATS[k]}</button>`).join("")}
function applyFilter(){const on=curCat!=="all",hit=id=>!on||CUES[id].c===curCat;
  doc.classList.toggle("filtering",on);list.classList.toggle("filtering",on);
  $$(".cue:not(.off)",doc).forEach(el=>el.classList.toggle("match",hit(el.dataset.id)&&on));$$(".ci").forEach(el=>el.classList.toggle("match",hit(el.dataset.id)));
  $$(".fm").forEach(el=>el.classList.toggle("faded",!hit(el.dataset.id)))}
$("#bar").addEventListener("click",e=>{const b=e.target.closest("[data-cat]");if(!b)return;curCat=curCat===b.dataset.cat?"all":b.dataset.cat;renderBar();applyFilter()});

/* ---------- hover: a cue lights up wherever it appears; on the lanes its interval shows on the axis ---------- */
let tip=null;
const showTip=(el,text)=>{tip?.remove();const r=el.getBoundingClientRect();tip=document.createElement("div");tip.className="tip";tip.textContent=text;tip.style.left=r.left+Math.min(r.width/2,40)+"px";tip.style.top=r.top-4+"px";document.body.appendChild(tip)};
function link(id,on){const q=CUES[id];if(!q)return;$$(`[data-id="${id}"]`).forEach(el=>el.classList.toggle("hot",on));
  if(id!==cur&&RG[id])setG(RG[id],on?"unfurl":restKey(q),on?`--${q.c}`:restColor)}
[ftl,clScroll,$("#cmScroll"),doc].forEach(r=>{
  r.addEventListener("pointerover",e=>{const t=e.target.closest("[data-id]");if(!t||t.contains(e.relatedTarget))return;link(t.dataset.id,true);
    if(t.classList.contains("fm")&&!drag){const q=CUES[t.dataset.id],h=$("#hrng");showTip(t,`${span(q)} · ${q.n} · ${secs(q.dur)}`);rngAt(h,q);h.hidden=t.dataset.id===cur}});
  r.addEventListener("pointerout",e=>{const t=e.target.closest("[data-id]");if(t&&!t.contains(e.relatedTarget)){link(t.dataset.id,false);tip?.remove();tip=null;const h=$("#hrng");if(h)h.hidden=true}})});

/* ---------- controls and keys: space play/pause, ←/→ five seconds (⇧ one), [ ] previous/next cue, Esc folds the script away ---------- */
$("#prev").innerHTML=ICON.prev;$("#next").innerHTML=ICON.next;
$("#pp").addEventListener("click",toggle);screen.addEventListener("click",toggle);
$("#prev").addEventListener("click",()=>step(-1));$("#next").addEventListener("click",()=>step(1));
document.addEventListener("keydown",e=>{if(e.metaKey||e.ctrlKey||e.altKey||e.target.closest?.("textarea,input"))return;
  if([" ","ArrowLeft","ArrowRight","[","]","Escape","c","C"].includes(e.key)&&document.activeElement!==document.body)document.activeElement.blur?.();
  if(e.key===" "){e.preventDefault();toggle()}
  else if(e.key==="ArrowRight"||e.key==="ArrowLeft"){e.preventDefault();seek(now()+(e.key==="ArrowRight"?1:-1)*(e.shiftKey?1:5))}
  else if(e.key==="]"||e.key==="[")step(e.key==="]"?1:-1);
  else if(e.key==="Escape"&&!ctx.hidden)hideCtx();
  else if(e.key==="Escape"&&EXP)closeScript();
  else if((e.key==="c"||e.key==="C")&&EXP&&SC.mode==="cue"){e.preventDefault();openDraft()}
  else if(e.key==="Enter"&&e.target.id==="ex")openScript()});
document.addEventListener("pointerdown",e=>{if(!e.target.closest(".cmenu,[data-act=stmenu],[data-act=cuemenu]"))closeMenu()});

/* header: role, takes recorded out of approved, the scramble on the nav */
function renderRole(){$("#role").innerHTML=[["director","Director"],["foley","Foley"]].map(([k,n])=>`<button class="tg" data-role="${k}" aria-pressed="${ROLE===k}">${n}</button>`).join("")}
$("#role").addEventListener("click",e=>{const b=e.target.closest("[data-role]");if(!b||b.dataset.role===ROLE)return;ROLE=b.dataset.role;try{localStorage.setItem("svsd-role",ROLE)}catch(e){}renderRole();renderComments();if(EXP)renderCard()});
const garden=glyph($("#garden"),"garden",{count:0,base:.14});
const GLY="ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#%&*+=/<>[]";
function scramble(el){
  if(reduce)return; const final=el.dataset.text||(el.dataset.text=el.textContent); if(el._raf)cancelAnimationFrame(el._raf);
  el.style.width=el.getBoundingClientRect().width+"px"; const t0=performance.now(), per=28, settle=final.length*per+160;
  (function step(now){const e=now-t0; let out="";
    for(let i=0;i<final.length;i++){const ch=final[i]; if(ch===" "||e>i*per+160){out+=ch;continue} out+=GLY[(Math.random()*GLY.length)|0]}
    el.textContent=out; if(e<settle){el._raf=requestAnimationFrame(step)}else{el.textContent=final;el.style.width="";el._raf=null}})(t0);
}
$$("[data-scr]").forEach(el=>{const host=el.closest("button")||el; host.addEventListener("pointerenter",()=>scramble(el))});
$$(".nav button").forEach(b=>b.addEventListener("click",()=>{$$(".nav button").forEach(x=>x.setAttribute("aria-selected",x===b));scramble(b.querySelector("[data-scr]"))}));
setTimeout(()=>$$("[data-scr]").forEach((el,i)=>setTimeout(()=>scramble(el),i*60)),200);

renderRole();counts();tally();renderTL();ppIcon();layoutFilm();setCur(ownerAt(0),true);syncSnippet();applyFilter();requestAnimationFrame(loop);
</script>
</body></html>
