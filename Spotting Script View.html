<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Spotting Script View (Copy) (Copy)</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Courier+Prime:wght@400;700&display=swap">
<style>
/* Single light look: the page background is the paper. Layout: shadcn/ui defaults. Score card on top; the Script card fills the rest of the screen and scrolls inside itself, one sticky header per set. Hovering a cue previews its clip in a thumbnail; clicking opens the full cue card with the clip on top. */
:root{
  --background:#f1efeb; --score-bg:#e8e5df; --foreground:#0c0a09; --card:#ffffff; --card-foreground:#0c0a09; --popover:#ffffff;
  --primary:#1c1917; --primary-foreground:#fafaf9; --secondary:#f5f3f0; --muted:#f5f3f0; --muted-foreground:#78716c;
  --accent:#f3f1ed; --border:#e5e2dd; --input:#e2ded8; --ring:#a1a1a1; --well:#0a0a0a; --well-fg:#fafafa;
  --radius:.625rem;
  --ambience:#7f9460; --footsteps:#c2643f; --props:#d69726; --cloth:#cf7f8b; --hardfx:#e0552b; --score:#8a5a7e;
  --shadow-sm:0 1px 2px rgba(0,0,0,.05); --shadow-md:0 4px 6px -1px rgba(0,0,0,.1),0 2px 4px -2px rgba(0,0,0,.1);
  --f-sans:"Geist",ui-sans-serif,system-ui,-apple-system,sans-serif; --f-mono:"Geist Mono",ui-monospace,Menlo,monospace;
  --f-script:"Courier Prime","Courier New",Courier,monospace;
}
*{box-sizing:border-box}
body{background:var(--background);color:var(--foreground);font-family:var(--f-sans);font-size:14px;line-height:20px;-webkit-font-smoothing:antialiased;
  min-height:100dvh;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 16px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
canvas.g{display:block;flex:none}
.wrap{max-width:1120px;width:100%;margin:0 auto;flex:1;min-height:0;display:flex;flex-direction:column;gap:20px}

/* header */
header.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding-block:14px;border-bottom:1px solid var(--border);
  font:500 11px/16px var(--f-mono);letter-spacing:.08em;text-transform:uppercase}
.brand{display:flex;align-items:center;gap:10px;color:var(--foreground)}
.crumb{color:var(--muted-foreground)}
.nav{display:flex;gap:4px}
.nav button{border:0;background:none;cursor:pointer;padding:4px 10px;font:inherit;letter-spacing:inherit;text-transform:inherit;color:var(--muted-foreground);white-space:pre}
.nav button:hover{color:var(--foreground)}
.nav button[aria-selected="true"]{color:var(--foreground)}
.nav button[aria-selected="true"]::before{content:"[ "}.nav button[aria-selected="true"]::after{content:" ]"}
.meta{justify-self:end;display:flex;gap:16px;color:var(--muted-foreground)}
.meta b{font-weight:500;color:var(--foreground)}
.scr{display:inline-block}
@media (max-width:760px){header.top{grid-template-columns:1fr auto}.meta{display:none}}

/* shadcn: Button */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:calc(var(--radius) - 2px);font-size:13px;font-weight:500;cursor:pointer;border:1px solid transparent;white-space:nowrap;transition:background .15s,opacity .15s}
.btn svg{width:14px;height:14px}
.btn-default{background:var(--primary);color:var(--primary-foreground)}
.btn-default:hover{opacity:.9}
.btn-outline{background:var(--background);border-color:var(--input);box-shadow:var(--shadow-sm)}
.btn-outline:hover{background:var(--accent)}
.btn-ghost{background:transparent}
.btn-ghost:hover{background:var(--accent)}
.btn-icon{width:32px;padding:0}
.btn:disabled{opacity:.5;pointer-events:none}

/* shadcn: Badge */
.badge{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:calc(var(--radius) - 4px);padding:1px 8px;font-size:12px;font-weight:500;line-height:18px;white-space:nowrap}
.badge i{width:6px;height:6px;border-radius:50%;background:var(--c)}

/* shadcn: ToggleGroup */
.toggles{display:flex;flex-wrap:wrap;gap:2px}
.tg{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;height:28px;padding:0 9px;border-radius:calc(var(--radius) - 2px);font-size:12.5px;font-weight:500;cursor:pointer;color:var(--muted-foreground);transition:background .15s,color .15s}
.tg:hover{color:var(--foreground)}
.tg[aria-pressed="true"]{background:var(--accent);color:var(--foreground)}
.tg i{width:6px;height:6px;border-radius:50%;background:var(--c)}
.tg b{font:400 11px var(--f-mono);color:var(--muted-foreground);opacity:.8}
.hint{color:var(--muted-foreground);font-size:13px}

/* shadcn: Card */
.card{background:var(--card);color:var(--card-foreground);border:1px solid var(--border);border-radius:calc(var(--radius) + 4px);box-shadow:var(--shadow-sm)}
.card-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 16px;padding:16px 20px 0}
.card-t{font-weight:600;font-size:14px;line-height:20px}
.card-d{color:var(--muted-foreground);font-size:13px}

/* score: a fill a shade darker than the page */
.score{background:var(--score-bg);border:0;border-radius:3px;box-shadow:none}
.staff-wrap{overflow-x:auto;padding:4px 20px 14px}
.staff{position:relative;min-width:960px;height:100px;display:grid;grid-template-columns:84px 1fr}
.clef{position:relative;border-right:1px solid var(--border)}
.clef span{position:absolute;right:10px;transform:translateY(-50%);font-size:11px;color:var(--muted-foreground);display:flex;align-items:center;gap:6px;white-space:nowrap}
.clef span i{width:5px;height:5px;border-radius:50%;background:var(--c)}
.lanes{position:relative}
.lanes .ln{position:absolute;left:0;right:0;height:1px;background:color-mix(in srgb,var(--foreground) 30%,var(--score-bg))}
.lanes .lane{position:absolute;left:0;right:0;height:12px;transform:translateY(-50%);border-radius:6px;pointer-events:none;
  background:linear-gradient(90deg,transparent 0%,color-mix(in srgb,var(--c) 8%,transparent) 40%,color-mix(in srgb,var(--c) 22%,transparent) 100%) no-repeat 0 0/0% 100%;
  transition:background-size .7s cubic-bezier(.22,1,.36,1)}
.lanes .lane.on{background-size:100% 100%}
.trail{position:absolute;left:0;height:12px;margin-top:-6px;border-radius:6px;pointer-events:none;transform-origin:left;
  background:linear-gradient(90deg,transparent 0%,color-mix(in srgb,var(--c) 10%,transparent) 45%,color-mix(in srgb,var(--c) 40%,transparent) 100%);
  animation:trail .55s cubic-bezier(.22,1,.36,1) both}
@keyframes trail{from{transform:scaleX(0);opacity:.3}to{transform:none;opacity:1}}
.lanes .barl{position:absolute;width:1px;background:color-mix(in srgb,var(--foreground) 38%,var(--score-bg))}
.lanes .sc{position:absolute;top:0;font:400 10px var(--f-mono);color:var(--muted-foreground);transform:translateX(5px);white-space:nowrap}
.mk{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border:0;padding:3px;background:transparent;border-radius:50%;cursor:pointer;transition:opacity .2s,transform .25s cubic-bezier(.3,1.4,.5,1),filter .25s;z-index:1}
.mk::before{content:"";position:absolute;inset:-3px;border-radius:50%;background:color-mix(in srgb,var(--c) 20%,var(--card));box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 35%,var(--card));opacity:0;transform:scale(.4);transition:opacity .25s,transform .35s cubic-bezier(.22,1,.36,1);pointer-events:none}
.mk canvas{position:relative}
.mk:hover,.mk.hot,.mk.match{z-index:3}
.mk:hover,.mk.hot{transform:scale(1.3)}
.mk:hover::before,.mk.hot::before{opacity:1;transform:none}
.mk.match::before{opacity:1;transform:scale(.85)}
.mk.faded{opacity:.2}

/* shadcn: Tooltip */
.tip{position:fixed;z-index:50;pointer-events:none;background:var(--primary);color:var(--primary-foreground);font-size:12px;line-height:16px;border-radius:calc(var(--radius) - 2px);padding:6px 10px;white-space:nowrap;transform:translate(-50%,-100%);margin-top:-10px;animation:tipin .12s ease-out}
@keyframes tipin{from{opacity:0;transform:translate(-50%,-90%)}}

/* script card: fixed height down to the bottom of the screen, scrolls inside */
.script{flex:1 1 0;min-height:420px;display:flex;flex-direction:row;gap:20px;min-width:0}
.pane{flex:1;min-width:0;position:relative;display:flex;flex-direction:column;border:1px solid var(--border);border-radius:3px;overflow:hidden}
.pane::after{content:"";position:absolute;left:0;right:0;bottom:0;height:88px;pointer-events:none;z-index:6;background:linear-gradient(to bottom,transparent,var(--background) 85%)}
.scroller{flex:1;min-width:0;min-height:0;overflow-y:auto;overscroll-behavior:contain;position:relative;scrollbar-width:thin;scrollbar-color:var(--input) transparent}
.doc{padding:0 0 96px}
.act{position:relative}
.act-h{position:sticky;top:0;z-index:5;display:flex;align-items:center;flex-wrap:wrap;gap:4px 14px;padding:11px 20px;width:100%;border:0;text-align:left;cursor:pointer;
  background:color-mix(in srgb,var(--background) 97%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);font:500 11px/16px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted-foreground)}
.act-h:hover{background:color-mix(in srgb,var(--accent) 92%,transparent)}
.act-h .chev{width:14px;height:14px;flex:none;color:var(--muted-foreground);transition:transform .25s cubic-bezier(.22,1,.36,1)}
.act.collapsed .chev{transform:rotate(-90deg)}
.act-body{display:grid;grid-template-rows:1fr;transition:grid-template-rows .3s cubic-bezier(.22,1,.36,1)}
.act-body>.inner{overflow:hidden;min-height:0}
.act.collapsed .act-body{grid-template-rows:0fr;visibility:hidden;transition:grid-template-rows .3s cubic-bezier(.22,1,.36,1),visibility 0s .3s}
.act-h .nm{color:var(--foreground);font-weight:600;display:flex;align-items:center;gap:8px}
.act-h .nm i{width:6px;height:6px;border-radius:1px;background:var(--foreground)}
.act-h .bd{letter-spacing:.04em}
.act-h .at{margin-left:auto;color:var(--foreground)}
.row{position:relative;display:grid;grid-template-columns:64px minmax(0,1fr)}
.gut{position:relative}
.scene-no{position:absolute;right:12px;top:22px;text-align:right;font:500 13px var(--f-mono);color:var(--muted-foreground)}
.page{padding:0 40px;font-family:var(--f-script);font-size:15px;line-height:28px;transition:opacity .35s}
.page p{margin:0;padding-bottom:20px}
.page .slug{font-weight:700;letter-spacing:.03em;padding-top:20px}
.page .sub{font-weight:700;padding-top:0}
.page .char{padding:4px 0 0 32%;padding-bottom:0}
.page .line{padding:0 16% 20px 20%}
.ci{display:grid;grid-template-columns:20px 1fr;align-items:center;gap:10px;border:0;background:transparent;text-align:left;cursor:pointer;border-radius:calc(var(--radius) - 2px);padding:6px 8px;transition:background .15s,opacity .3s}
.ci:hover,.ci.hot,.ci.open{background:var(--accent)}
/* the cue list is its own column; an entry is only there while its cue is on screen */
.cuelist{width:240px;flex:none;display:flex;flex-direction:column;min-height:0}
.cuelist-h{padding:11px 8px;border-bottom:1px solid var(--border);font:500 11px/16px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted-foreground)}
.cl-scroll{flex:1;min-height:0;position:relative;overflow-y:auto;scrollbar-width:none;padding-top:8px;-webkit-mask-image:linear-gradient(to bottom,transparent,#000 18px,#000 calc(100% - 64px),transparent);mask-image:linear-gradient(to bottom,transparent,#000 18px,#000 calc(100% - 64px),transparent)}

.ci{opacity:.17;transition:background .15s,opacity .35s}
.ci.in,.ci.open,.ci:hover{opacity:1}
.ci .lbl{font-size:13px;font-weight:500;line-height:18px;min-width:0}
.ci .cat{display:block;font-size:12px;font-weight:400;color:var(--muted-foreground)}

/* highlight */
.cue{cursor:pointer;border-radius:3px;-webkit-box-decoration-break:clone;box-decoration-break:clone;
  background-image:linear-gradient(90deg,transparent 0%,color-mix(in srgb,var(--c) 10%,transparent) 35%,color-mix(in srgb,var(--c) 38%,transparent) 100%),
    linear-gradient(90deg,color-mix(in srgb,var(--c) 10%,transparent),color-mix(in srgb,var(--c) 55%,transparent));
  background-repeat:no-repeat;background-position:0 0,0 100%;background-size:0% 100%,100% 1px;
  transition:background-size .55s cubic-bezier(.22,1,.36,1),color .2s}
.cue.hot,.doc.filtering .cue.match{background-size:100% 100%,100% 1px}
.doc.filtering .cue:not(.match){background-size:0% 100%,0% 1px}
.doc.focusing .row:not(.focus-row) .page{opacity:.35}
.cuelist.filtering .ci:not(.match){opacity:.1}
.cuelist.filtering .ci:hover{opacity:1}

/* shadcn: Popover: the cue card (fixed, follows its cue while the script scrolls) */
.pop{position:fixed;z-index:30;width:248px;animation:popin .16s ease-out;transition:width .3s cubic-bezier(.22,1,.36,1)}
.pop.open{width:320px}
.pop{cursor:grab;user-select:none;-webkit-user-select:none}
.pop .btn{cursor:pointer}
.pop.dragging,.pop.dragging *{cursor:grabbing!important}
.pop:not(.open)::after{content:"";position:absolute;inset:-14px;z-index:-1}
.pop:not(.open) .x{display:none}
.cap,.more{display:grid;transition:grid-template-rows .3s cubic-bezier(.22,1,.36,1)}
.cap{grid-template-rows:1fr}.pop.open .cap{grid-template-rows:0fr}
.more{grid-template-rows:0fr;visibility:hidden}.pop.open .more{grid-template-rows:1fr;visibility:visible}
.cap>div,.more>div{overflow:hidden;min-height:0}
@keyframes popin{from{opacity:0;transform:translateY(-4px) scale(.98)}}
.pop .panel{background:var(--popover);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-md);overflow:hidden}

/* clip thumbnail: always the first thing in the card */
.clipslot{position:relative;aspect-ratio:16/9;max-width:100%;margin:6px 6px 0;background:#000;border-radius:calc(var(--radius) - 3px);overflow:hidden}
.clipslot .media{position:absolute;inset:0}
.clipslot .media canvas,.clipslot .media video{display:block;width:100%;height:100%;object-fit:cover}
.cliptag{position:absolute;left:8px;top:8px;display:flex;align-items:center;gap:6px;font:400 10.5px/14px var(--f-mono);color:#e5e5e5;background:rgba(0,0,0,.55);padding:2px 7px;border-radius:4px;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.cliptag i{width:6px;height:6px;border-radius:50%;background:var(--c,#a3a3a3)}
.cliptag.rec{color:#fafafa}.cliptag.rec i{background:#ef4444;animation:blink 1s steps(2) infinite}
.clipslot .x{position:absolute;right:6px;top:6px;color:#e5e5e5;background:rgba(0,0,0,.45);height:28px;width:28px}
.clipslot .x:hover{background:rgba(0,0,0,.75);color:#fff}
.peekcap{display:flex;justify-content:space-between;gap:8px;padding:8px 12px 10px;font-size:12px;line-height:16px;color:var(--muted-foreground)}

/* record countdown */
.cd{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.5)}
.cd i{position:absolute;width:96px;height:96px;border-radius:50%;border:2px solid rgba(255,255,255,.7);animation:ring 1s ease-out both}
.cd b{font:500 64px/1 var(--f-mono);color:#fafafa;animation:cdpop 1s ease-out both}
.cd small{position:absolute;bottom:10px;font:400 10.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:#d4d4d4}
@keyframes ring{from{transform:scale(1.5);opacity:0}30%{opacity:1}to{transform:scale(.8);opacity:.2}}
@keyframes cdpop{0%{opacity:0;transform:scale(1.4)}25%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:.1;transform:scale(.9)}}

/* hero: waveform / glyph */
.hero{position:relative;height:88px;background:var(--well);display:grid;place-items:center;margin:6px 6px 0;border-radius:calc(var(--radius) - 3px);overflow:hidden}
.hero canvas.big{width:48px;height:48px}
.hero .tag{position:absolute;left:8px;top:7px;z-index:2;display:flex;align-items:center;gap:6px;font:400 10.5px var(--f-mono);color:#a3a3a3}
.hero .tag i{width:6px;height:6px;border-radius:50%;background:#a3a3a3}
.hero .tag.rec i{background:#ef4444;animation:blink 1s steps(2) infinite}
.hero .tag.rec{color:#fafafa}
@keyframes blink{50%{opacity:.15}}
.hero .tl{position:absolute;right:6px;top:4px;z-index:2;display:flex;gap:2px}
.hero .btn-ghost{color:#d4d4d4;height:28px;width:28px}
.hero .btn-ghost:hover{background:#262626;color:#fafafa}
.wave{position:absolute;inset:0}
.wave .bars{position:absolute;inset:0;display:flex;align-items:center;gap:2px;padding:24px 14px 12px;transition:opacity .2s}
.wave .bars span{flex:1;height:var(--h);min-height:2px;border-radius:2px;background:var(--c);opacity:.9}
.wave.playing::after{content:"";position:absolute;top:22px;bottom:10px;width:2px;border-radius:1px;background:#fafafa;left:14px;animation:sweep 1.7s linear forwards}
@keyframes sweep{to{left:calc(100% - 16px)}}
.wave.playing::after{animation-duration:var(--d,1.7s)}
.hero .tag{max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wave .clear{position:absolute;left:50%;top:55%;transform:translate(-50%,-50%) scale(.96);opacity:0;pointer-events:none;
  background:rgba(10,10,10,.82);border-color:#404040;color:#fafafa;transition:opacity .15s,transform .15s,background .15s}
.wave .clear svg{color:#f87171}
.wave .clear:hover{background:#1f1f1f;border-color:#6b2c2c}
.wave:hover .clear,.wave:focus-within .clear{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.wave:hover .bars,.wave:focus-within .bars{opacity:.2}
@media (hover:none){.wave .clear{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}.wave .bars{opacity:.3}}

.pop .head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:12px 14px 0}
.pop h3{margin:0;font-size:14px;font-weight:600;line-height:20px}
.pop .sub{color:var(--muted-foreground);font-size:12px;line-height:16px}
.pop .body{padding:12px 14px 14px}
.pop .lab{font-size:12px;font-weight:500;color:var(--muted-foreground)}
.pop .note{margin:4px 0 0;font:400 13px/20px var(--f-script)}
.pop .line{margin:10px 0 0;padding-top:10px;border-top:1px solid var(--border);font-size:12px;color:var(--muted-foreground)}
.pop .line em{font-style:normal;font-family:var(--f-script);color:var(--foreground)}
.pop .acts{display:flex;justify-content:center;gap:8px;padding:0 14px 14px}

/* right-click menu */
.ctx{position:fixed;z-index:50;min-width:150px;padding:4px;background:var(--popover);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-md);animation:popin .12s ease-out}
.ctx[hidden]{display:none}
.ctx button{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;padding:7px 10px;border-radius:calc(var(--radius) - 3px);font:inherit;font-size:13px;color:var(--foreground);cursor:pointer;text-align:left}
.ctx button:hover,.ctx button:focus-visible{background:var(--accent);outline:0}
.ctx svg{width:14px;height:14px}
/* drop targets, upload zone, library */
.btn-drop{background:transparent;color:var(--foreground);border:1px dashed var(--ring)}
.btn-drop:hover{background:var(--accent);border-color:var(--foreground)}
.hero.dz{background:transparent;border:1px dashed var(--input);margin:6px 8px 0;height:86px}
.dzb{all:unset;box-sizing:border-box;position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;color:var(--foreground);font-size:13px;border-radius:inherit}
.dzb svg{width:18px;height:18px;margin-bottom:3px;color:var(--muted-foreground)}
.dzb small{color:var(--muted-foreground);font-size:12px}
.dzb:hover,.dzb:focus-visible{background:var(--accent)}
.pop.drop{outline:2px dashed var(--foreground);outline-offset:3px;border-radius:12px}
.pop.drop .hero.dz{background:var(--accent);border-color:var(--foreground)}
.cue.drop{outline:1px dashed var(--c);outline-offset:2px;background-size:100% 100%,100% 1px}
.ci.drop{background:var(--accent);outline:1px dashed var(--ring)}
.lib{padding:10px 12px 12px}
.lib-h{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;margin-bottom:8px}
.lib-h small{margin-left:auto;color:var(--muted-foreground);font:400 11px var(--f-mono)}
.lib-h .btn{width:26px;height:26px;margin-left:-6px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}

/* shadcn Sonner-style toast */
function toast(msg,file,cat,key="set"){const t=document.createElement("div");t.className="toast";t.innerHTML=`<canvas class="g" style="width:16px;height:16px" aria-hidden="true"></canvas><div>${msg}<small>${file}</small></div>`;
  $("#toasts").appendChild(t);glyph(t.querySelector("canvas"),key,{color:`--${cat}`,base:.08});setTimeout(()=>t.remove(),2800)}

/* ---------- sound sketches ---------- */
let ac=null,noiseBuf=null;
function actx(){if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();noiseBuf=ac.createBuffer(1,ac.sampleRate*3,ac.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}return ac}
function burst(out,t,dur,type,freq,q,peak,attack=.005){const s=ac.createBufferSource();s.buffer=noiseBuf;const fl=ac.createBiquadFilter();fl.type=type;fl.frequency.value=freq;fl.Q.value=q;
  const g=ac.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(peak,t+attack);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(fl).connect(g).connect(out);s.start(t,Math.random()*1.5);s.stop(t+dur+.05)}
function tone(out,t,dur,freq,peak,type="sine",end){const o=ac.createOscillator();o.type=type;o.frequency.setValueAtTime(freq,t);if(end)o.frequency.exponentialRampToValueAtTime(end,t+dur);
  const g=ac.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(peak,t+Math.min(.04,dur/3));g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(out);o.start(t);o.stop(t+dur+.05)}
function play(cat){actx();ac.resume();const out=ac.createGain();out.gain.value=.7;out.connect(ac.destination);const t=ac.currentTime+.03;
  if(cat==="footsteps"){[0,.42,.86,1.3].forEach(o=>{burst(out,t+o,.09,"bandpass",900,1.2,.9);tone(out,t+o,.08,90,.4)})}
  else if(cat==="props"){[0,.18,.31,.62,.7].forEach((o,i)=>burst(out,t+o,.05,"highpass",2400+i*300,.8,.7))}
  else if(cat==="cloth"){burst(out,t,.5,"bandpass",2200,.7,.45,.2);burst(out,t+.55,.6,"bandpass",1800,.7,.35,.25)}
  else if(cat==="hardfx"){tone(out,t,.9,110,.9,"sine",38);burst(out,t,.7,"lowpass",420,.7,.8)}
  else if(cat==="ambience"){burst(out,t,1.6,"highpass",3000,.3,.18,.6);burst(out,t,1.6,"lowpass",500,.5,.25,.6)}
  else{[220,277.2,329.6].forEach((fq,i)=>tone(out,t+i*.12,1.6,fq,.16))}}
</script>
