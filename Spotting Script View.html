<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Spotting Script View (Copy) (Copy)</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Courier+Prime:wght@400;700&display=swap">
<style>
/* Single light look: the page background is the paper. Layout: shadcn/ui defaults. Score card on top; the Script card fills the rest of the screen and scrolls inside itself, one sticky header per set. Hovering a cue previews its clip in a thumbnail; clicking opens the full cue card with the clip on top. */
:root{
  --background:#f1efeb; --score-bg:#e8e5df; --foreground:#0c0a09; --card:#ffffff; --card-foreground:#0c0a09; --popover:#ffffff;
  --primary:#1c1917; --primary-foreground:#fafaf9; --secondary:#f5f3f0; --muted:#f5f3f0; --muted-foreground:#78716c;
  --accent:#f3f1ed; --border:#e5e2dd; --input:#e2ded8; --ring:#a1a1a1; --well:#0a0a0a; --well-fg:#fafafa;
  --radius:.625rem; --link:#2b8ff0;
  --ambience:#7f9460; --footsteps:#c2643f; --props:#d69726; --cloth:#cf7f8b; --hardfx:#e0552b; --score:#8a5a7e;
  --shadow-sm:0 1px 2px rgba(0,0,0,.05); --shadow-md:0 4px 6px -1px rgba(0,0,0,.1),0 2px 4px -2px rgba(0,0,0,.1);
  --f-sans:"Geist",ui-sans-serif,system-ui,-apple-system,sans-serif; --f-mono:"Geist Mono",ui-monospace,Menlo,monospace;
  --f-script:"Courier Prime","Courier New",Courier,monospace;
}
*{box-sizing:border-box}
body{background:var(--background);color:var(--foreground);font-family:var(--f-sans);font-size:14px;line-height:20px;-webkit-font-smoothing:antialiased;
  min-height:100dvh;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 16px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
canvas.g{display:block;flex:none}
.wrap{max-width:1120px;width:100%;margin:0 auto;flex:1;min-height:0;display:flex;flex-direction:column;gap:20px}

/* header */
header.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding-block:14px;border-bottom:1px solid var(--border);
  font:500 11px/16px var(--f-mono);letter-spacing:.08em;text-transform:uppercase}
.brand{display:flex;align-items:center;gap:10px;color:var(--foreground)}
.crumb{color:var(--muted-foreground)}
.nav{display:flex;gap:4px}
.nav button{border:0;background:none;cursor:pointer;padding:4px 10px;font:inherit;letter-spacing:inherit;text-transform:inherit;color:var(--muted-foreground);white-space:pre}
.nav button:hover{color:var(--foreground)}
.nav button[aria-selected="true"]{color:var(--foreground)}
.nav button[aria-selected="true"]::before{content:"[ "}.nav button[aria-selected="true"]::after{content:" ]"}
.meta{justify-self:end;display:flex;gap:16px;color:var(--muted-foreground)}
.meta b{font-weight:500;color:var(--foreground)}
.scr{display:inline-block}
@media (max-width:760px){header.top{grid-template-columns:1fr auto}.meta>span{display:none}}

/* shadcn: Button */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:calc(var(--radius) - 2px);font-size:13px;font-weight:500;cursor:pointer;border:1px solid transparent;white-space:nowrap;transition:background .15s,opacity .15s}
.btn svg{width:14px;height:14px}
.btn-default{background:var(--primary);color:var(--primary-foreground)}
.btn-default:hover{opacity:.9}
.btn-outline{background:var(--background);border-color:var(--input);box-shadow:var(--shadow-sm)}
.btn-outline:hover{background:var(--accent)}
.btn-ghost{background:transparent}
.btn-ghost:hover{background:var(--accent)}
.btn-icon{width:32px;padding:0}
.btn:disabled{opacity:.5;pointer-events:none}

/* shadcn: Badge */
.badge{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:calc(var(--radius) - 4px);padding:1px 8px;font-size:12px;font-weight:500;line-height:18px;white-space:nowrap}
.badge i{width:6px;height:6px;border-radius:50%;background:var(--c)}

/* shadcn: ToggleGroup */
.toggles{display:flex;flex-wrap:wrap;gap:2px}
.tg{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;height:28px;padding:0 9px;border-radius:calc(var(--radius) - 2px);font-size:12.5px;font-weight:500;cursor:pointer;color:var(--muted-foreground);transition:background .15s,color .15s}
.tg:hover{color:var(--foreground)}
.tg[aria-pressed="true"]{background:var(--accent);color:var(--foreground)}
.tg i{width:6px;height:6px;border-radius:50%;background:var(--c)}
.tg b{font:400 11px var(--f-mono);color:var(--muted-foreground);opacity:.8}
.hint{color:var(--muted-foreground);font-size:13px}

/* shadcn: Card */
.card{background:var(--card);color:var(--card-foreground);border:1px solid var(--border);border-radius:calc(var(--radius) + 4px);box-shadow:var(--shadow-sm)}
.card-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 16px;padding:16px 20px 0}
.card-t{font-weight:600;font-size:14px;line-height:20px}
.card-d{color:var(--muted-foreground);font-size:13px}

/* score: a fill a shade darker than the page */
.score{background:var(--score-bg);border:0;border-radius:3px;box-shadow:none}
.staff-wrap{overflow-x:auto;padding:4px 20px 14px}
.staff{position:relative;min-width:960px;height:100px;display:grid;grid-template-columns:84px 1fr}
.clef{position:relative;border-right:1px solid var(--border)}
.clef span{position:absolute;right:10px;transform:translateY(-50%);font-size:11px;color:var(--muted-foreground);display:flex;align-items:center;gap:6px;white-space:nowrap}
.clef span i{width:5px;height:5px;border-radius:50%;background:var(--c)}
.lanes{position:relative}
.lanes .ln{position:absolute;left:0;right:0;height:1px;background:color-mix(in srgb,var(--foreground) 30%,var(--score-bg))}
.lanes .lane{position:absolute;left:0;right:0;height:12px;transform:translateY(-50%);border-radius:6px;pointer-events:none;
  background:linear-gradient(90deg,transparent 0%,color-mix(in srgb,var(--c) 8%,transparent) 40%,color-mix(in srgb,var(--c) 22%,transparent) 100%) no-repeat 0 0/0% 100%;
  transition:background-size .7s cubic-bezier(.22,1,.36,1)}
.lanes .lane.on{background-size:100% 100%}
.trail{position:absolute;left:0;height:12px;margin-top:-6px;border-radius:6px;pointer-events:none;transform-origin:left;
  background:linear-gradient(90deg,transparent 0%,color-mix(in srgb,var(--c) 10%,transparent) 45%,color-mix(in srgb,var(--c) 40%,transparent) 100%);
  animation:trail .55s cubic-bezier(.22,1,.36,1) both}
@keyframes trail{from{transform:scaleX(0);opacity:.3}to{transform:none;opacity:1}}
.lanes .barl{position:absolute;width:1px;background:color-mix(in srgb,var(--foreground) 38%,var(--score-bg))}
.lanes .sc{position:absolute;top:0;font:400 10px var(--f-mono);color:var(--muted-foreground);transform:translateX(5px);white-space:nowrap}
.mk{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border:0;padding:3px;background:transparent;border-radius:50%;cursor:pointer;transition:opacity .2s,transform .25s cubic-bezier(.3,1.4,.5,1),filter .25s;z-index:1}
.mk::before{content:"";position:absolute;inset:-3px;border-radius:50%;background:color-mix(in srgb,var(--c) 20%,var(--card));box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 35%,var(--card));opacity:0;transform:scale(.4);transition:opacity .25s,transform .35s cubic-bezier(.22,1,.36,1);pointer-events:none}
.mk canvas{position:relative}
.mk:hover,.mk.hot,.mk.match{z-index:3}
.mk:hover,.mk.hot{transform:scale(1.3)}
.mk:hover::before,.mk.hot::before{opacity:1;transform:none}
.mk.match::before{opacity:1;transform:scale(.85)}
.mk.faded{opacity:.2}
/* the staff is also the timeline: one slot per clip, as long as the clip; comments ride their category lane inside it */
.lanes .slot{position:absolute;top:14px;height:72px;border-left:1px solid color-mix(in srgb,var(--foreground) 16%,var(--score-bg));background:color-mix(in srgb,var(--foreground) 3%,transparent);cursor:crosshair;transition:background .15s}
.lanes .slot:hover{background:color-mix(in srgb,var(--foreground) 6%,transparent)}
.lanes .slot.cur{background:color-mix(in srgb,var(--foreground) 9%,transparent)}
.lanes .slot.drop{outline:1px dashed var(--foreground);outline-offset:-1px}
.cm{position:absolute;height:8px;min-width:8px;margin-top:-4px;padding:0;border:0;border-radius:4px;cursor:pointer;z-index:2;
  background:color-mix(in srgb,var(--c) 45%,transparent);box-shadow:inset 0 0 0 1px var(--c);transition:opacity .2s,box-shadow .15s}
.cm.pt{width:8px;margin-left:-4px;border-radius:50%;background:var(--c)}
.cm.addressed{background:repeating-linear-gradient(135deg,var(--c) 0 2px,transparent 2px 4px)}
.cm.approved{background:transparent;opacity:.5}
.cm:hover,.cm.on{z-index:4;opacity:1;box-shadow:inset 0 0 0 1px var(--c),0 0 0 2px var(--score-bg),0 0 0 3px var(--c)}
.cm.faded{opacity:.12}
.lanes .ph{position:absolute;top:10px;height:80px;width:2px;margin-left:-1px;border-radius:1px;background:var(--foreground);pointer-events:none;z-index:5}
.lanes .sel{position:absolute;top:14px;height:72px;background:color-mix(in srgb,var(--foreground) 12%,transparent);border-inline:1px solid var(--foreground);pointer-events:none;z-index:3}
.filters{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
.vsep{width:1px;height:16px;background:color-mix(in srgb,var(--foreground) 18%,transparent)}

/* shadcn: Tooltip */
.tip{position:fixed;z-index:50;pointer-events:none;background:var(--primary);color:var(--primary-foreground);font-size:12px;line-height:16px;border-radius:calc(var(--radius) - 2px);padding:6px 10px;white-space:nowrap;transform:translate(-50%,-100%);margin-top:-10px;animation:tipin .12s ease-out}
@keyframes tipin{from{opacity:0;transform:translate(-50%,-90%)}}

/* script card: fixed height down to the bottom of the screen, scrolls inside */
.script{flex:1 1 0;min-height:420px;display:flex;flex-direction:row;gap:20px;min-width:0}
.pane{flex:1;min-width:0;position:relative;display:flex;flex-direction:column;border:1px solid var(--border);border-radius:3px;overflow:hidden}
.pane::after{content:"";position:absolute;left:0;right:0;bottom:0;height:88px;pointer-events:none;z-index:6;background:linear-gradient(to bottom,transparent,var(--background) 85%)}
.scroller{flex:1;min-width:0;min-height:0;overflow-y:auto;overscroll-behavior:contain;position:relative;scrollbar-width:thin;scrollbar-color:var(--input) transparent}
.doc{padding:0 0 96px}
.act{position:relative}
.act-h{position:sticky;top:0;z-index:5;display:flex;align-items:center;flex-wrap:wrap;gap:4px 14px;padding:11px 20px;width:100%;border:0;text-align:left;cursor:pointer;
  background:color-mix(in srgb,var(--background) 97%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);font:500 11px/16px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted-foreground)}
.act-h:hover{background:color-mix(in srgb,var(--accent) 92%,transparent)}
.act-h .chev{width:14px;height:14px;flex:none;color:var(--muted-foreground);transition:transform .25s cubic-bezier(.22,1,.36,1)}
.act.collapsed .chev{transform:rotate(-90deg)}
.act-body{display:grid;grid-template-rows:1fr;transition:grid-template-rows .3s cubic-bezier(.22,1,.36,1)}
.act-body>.inner{overflow:hidden;min-height:0}
.act.collapsed .act-body{grid-template-rows:0fr;visibility:hidden;transition:grid-template-rows .3s cubic-bezier(.22,1,.36,1),visibility 0s .3s}
.act-h .nm{color:var(--foreground);font-weight:600;display:flex;align-items:center;gap:8px}
.act-h .nm i{width:6px;height:6px;border-radius:1px;background:var(--foreground)}
.act-h .bd{letter-spacing:.04em}
.act-h .at{margin-left:auto;color:var(--foreground)}
.row{position:relative;display:grid;grid-template-columns:64px minmax(0,1fr)}
.gut{position:relative}
.scene-no{position:absolute;right:12px;top:22px;text-align:right;font:500 13px var(--f-mono);color:var(--muted-foreground)}
.page{padding:0 40px;font-family:var(--f-script);font-size:15px;line-height:28px;transition:opacity .35s}
.page p{margin:0;padding-bottom:20px}
.page .slug{font-weight:700;letter-spacing:.03em;padding-top:20px}
.page .sub{font-weight:700;padding-top:0}
.page .char{padding:4px 0 0 32%;padding-bottom:0}
.page .line{padding:0 16% 20px 20%}
.ci{display:grid;grid-template-columns:20px 1fr;align-items:center;gap:10px;border:0;background:transparent;text-align:left;cursor:pointer;border-radius:calc(var(--radius) - 2px);padding:6px 8px;transition:background .15s,opacity .3s}
.ci:hover,.ci.hot,.ci.open{background:var(--accent)}
/* the cue list is its own column; an entry is only there while its cue is on screen */
.cuelist{width:240px;flex:none;display:flex;flex-direction:column;min-height:0}
.cuelist-h{padding:11px 8px;border-bottom:1px solid var(--border);font:500 11px/16px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted-foreground)}
.cl-scroll{flex:1;min-height:0;position:relative;overflow-y:auto;scrollbar-width:none;padding-top:8px;-webkit-mask-image:linear-gradient(to bottom,transparent,#000 18px,#000 calc(100% - 64px),transparent);mask-image:linear-gradient(to bottom,transparent,#000 18px,#000 calc(100% - 64px),transparent)}

.ci{opacity:.17;transition:background .15s,opacity .35s}
.ci.in,.ci.open,.ci:hover{opacity:1}
.ci .lbl{font-size:13px;font-weight:500;line-height:18px;min-width:0}
.ci .cat{display:block;font-size:12px;font-weight:400;color:var(--muted-foreground)}
/* cue list: unresolved-comment count, and a checkbox per approved cue in the "To record" view */
.cuelist-h{display:flex;align-items:center;justify-content:space-between;gap:6px}
.cuelist-h .tg{height:24px;padding:0 7px;font:500 12px var(--f-sans);letter-spacing:0;text-transform:none}
.ci{position:relative;padding-right:30px}
.ci .cc{position:absolute;right:8px;top:8px;min-width:18px;padding:0 5px;border:1px solid var(--border);border-radius:999px;background:var(--card);font:400 10.5px/16px var(--f-mono);color:var(--muted-foreground);text-align:center}
.ck{display:none;position:absolute;right:9px;top:50%;width:16px;height:16px;margin-top:-8px;border:1.5px solid var(--input);border-radius:4px;background:var(--card);cursor:pointer}
.ck[aria-checked=true]{background:var(--foreground);border-color:var(--foreground)}
.ck[aria-checked=true]::after{content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;border:solid var(--background);border-width:0 1.5px 1.5px 0;transform:rotate(45deg)}
.cuelist.todo .ck{display:block}.cuelist.todo .cc{display:none}
.cuelist.todo .ci.match{opacity:1}

/* highlight */
.cue{cursor:pointer;border-radius:3px;-webkit-box-decoration-break:clone;box-decoration-break:clone;
  background-image:linear-gradient(90deg,transparent 0%,color-mix(in srgb,var(--c) 10%,transparent) 35%,color-mix(in srgb,var(--c) 38%,transparent) 100%),
    linear-gradient(90deg,color-mix(in srgb,var(--c) 10%,transparent),color-mix(in srgb,var(--c) 55%,transparent));
  background-repeat:no-repeat;background-position:0 0,0 100%;background-size:0% 100%,100% 1px;
  transition:background-size .55s cubic-bezier(.22,1,.36,1),color .2s}
.cue.hot,.doc.filtering .cue.match{background-size:100% 100%,100% 1px}
.doc.filtering .cue:not(.match){background-size:0% 100%,0% 1px}
.doc.focusing .row:not(.focus-row) .page{opacity:.35}
.cuelist.filtering .ci:not(.match){opacity:.1}
.cuelist.filtering .ci:hover{opacity:1}

/* shadcn: Popover: the cue card (fixed, follows its cue while the script scrolls) */
.pop{position:fixed;z-index:30;width:248px;animation:popin .16s ease-out;transition:width .3s cubic-bezier(.22,1,.36,1)}
.pop.open{width:340px}
.pop{cursor:grab;user-select:none;-webkit-user-select:none}
.pop .btn{cursor:pointer}
.pop.dragging,.pop.dragging *{cursor:grabbing!important}
.pop:not(.open)::after{content:"";position:absolute;inset:-14px;z-index:-1}
.pop:not(.open) .x{display:none}
.cap,.more{display:grid;transition:grid-template-rows .3s cubic-bezier(.22,1,.36,1)}
.cap{grid-template-rows:1fr}.pop.open .cap{grid-template-rows:0fr}
.more{grid-template-rows:0fr;visibility:hidden}.pop.open .more{grid-template-rows:1fr;visibility:visible}
.cap>div,.more>div{overflow:hidden;min-height:0}
@keyframes popin{from{opacity:0;transform:translateY(-4px) scale(.98)}}
.pop .panel{background:var(--popover);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-md);overflow:hidden}

/* clip thumbnail: always the first thing in the card */
.clipslot{position:relative;aspect-ratio:16/9;max-width:100%;margin:6px 6px 0;background:#000;border-radius:calc(var(--radius) - 3px);overflow:hidden}
.clipslot .media{position:absolute;inset:0}
.clipslot .media canvas,.clipslot .media video{display:block;width:100%;height:100%;object-fit:cover}
.cliptag{position:absolute;left:8px;top:8px;display:flex;align-items:center;gap:6px;font:400 10.5px/14px var(--f-mono);color:#e5e5e5;background:rgba(0,0,0,.55);padding:2px 7px;border-radius:4px;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.cliptag i{width:6px;height:6px;border-radius:50%;background:var(--c,#a3a3a3)}
.cliptag.rec{color:#fafafa}.cliptag.rec i{background:#ef4444;animation:blink 1s steps(2) infinite}
.clipslot .x{position:absolute;right:6px;top:6px;color:#e5e5e5;background:rgba(0,0,0,.45);height:28px;width:28px}
.clipslot .x:hover{background:rgba(0,0,0,.75);color:#fff}
.peekcap{display:flex;justify-content:space-between;gap:8px;padding:8px 12px 10px;font-size:12px;line-height:16px;color:var(--muted-foreground)}

/* record countdown */
.cd{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.5)}
.cd i{position:absolute;width:96px;height:96px;border-radius:50%;border:2px solid rgba(255,255,255,.7);animation:ring 1s ease-out both}
.cd b{font:500 64px/1 var(--f-mono);color:#fafafa;animation:cdpop 1s ease-out both}
.cd small{position:absolute;bottom:10px;font:400 10.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:#d4d4d4}
@keyframes ring{from{transform:scale(1.5);opacity:0}30%{opacity:1}to{transform:scale(.8);opacity:.2}}
@keyframes cdpop{0%{opacity:0;transform:scale(1.4)}25%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:.1;transform:scale(.9)}}

.pop .head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:12px 14px 0}
.pop h3{margin:0;font-size:14px;font-weight:600;line-height:20px}
.pop .sub{color:var(--muted-foreground);font-size:12px;line-height:16px}
.pop .body{padding:12px 14px 14px}
.pop .lab{font-size:12px;font-weight:500;color:var(--muted-foreground)}
.pop .note{margin:4px 0 0;font:400 13px/20px var(--f-script)}
.pop .line{margin:10px 0 0;padding-top:10px;border-top:1px solid var(--border);font-size:12px;color:var(--muted-foreground)}
.pop .line em{font-style:normal;font-family:var(--f-script);color:var(--foreground)}
.pop.open .more>div{overflow-y:auto;max-height:calc(100dvh - 250px);scrollbar-width:thin;scrollbar-color:var(--input) transparent}
.pop textarea,.pop .thread{user-select:text;-webkit-user-select:text;cursor:auto}
.pop .acts{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:0 14px 14px}
.pop .empty{margin:4px 0;color:var(--muted-foreground);font-size:12.5px}

/* voice memos in a dark well */
.hero{position:relative;height:88px;background:var(--well);display:grid;place-items:center;margin:6px 6px 0;border-radius:calc(var(--radius) - 3px);overflow:hidden}
.hero .tag{position:absolute;left:8px;top:7px;z-index:2;display:flex;align-items:center;gap:6px;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:400 10.5px var(--f-mono);color:#a3a3a3}
.hero .tag i{flex:none;width:6px;height:6px;border-radius:50%;background:#a3a3a3}
.hero .tl{position:absolute;right:6px;top:4px;z-index:2;display:flex;align-items:center;gap:2px}
.hero .btn-ghost{color:#d4d4d4;height:28px;width:28px}
.hero .btn-ghost:hover{background:#262626;color:#fafafa}
.wave{position:absolute;inset:0}
.wave .bars{position:absolute;inset:0;display:flex;align-items:center;gap:2px;padding:24px 14px 12px;transition:opacity .2s}
.wave .bars span{flex:1;height:var(--h);min-height:2px;border-radius:2px;background:var(--c);opacity:.9}

/* (Once dragged, the card keeps the spot it was dropped in.) Opened from the script, the card sits beside the cue: to its right when the cue is in the left half of the script pane, to its left otherwise; its top edge
   lines up with the cue when the cue is in the upper half, its bottom edge when in the lower half (so it grows upward from there).
   The anchor is the visible part of the cue, so the card stays on screen when the cue is partly scrolled out. Opened from the score, it sits above the marker;
   in clip view, beside the comment's box on the frame, or beside the player. */

    if(bx){const r=bx.getBoundingClientRect();x=r.right+14;y=r.top-6;if(x+w>vw-16)x=r.left-14-w}else{x=p.right+14;y=p.top;if(x+w>vw-16)x=p.right-w-14}}
  else if(c.anchor==="score"){const a=(c.acid&&$(`.cm[data-cid="${c.acid}"]`,tl))||$(`.mk[data-id="${c.id}"]`,tl);if(!a)return;const r=a.getBoundingClientRect();x=r.left+r.width/2-w/2;y=r.top-h-14}
  else{const sp=$(`.cue[data-id="${c.id}"]`),r=sp?.getClientRects()[0];if(!r)return;const sr=doc.getBoundingClientRect(),
    y0=cl(r.top,sr.top+$(".act-h").offsetHeight,sr.bottom),y1=cl(r.bottom,y0,sr.bottom);x=c.right?r.right+10:r.left-10-w;y=c.up?y1-h:y0}
  c.el.style.left=cl(x,16,vw-16-w)+"px";c.el.style.top=cl(y,8,vh-h-8)+"px";placeBar(c);

function follow(c,ms=400){const t0=performance.now();(function f(){if(card!==c)return;place(c);if(performance.now()-t0<ms)requestAnimationFrame(f)})()}
const clipPlay=c=>{c.clipOn=true;c.clip.play()}, clipPause=c=>{c.clipOn=false;c.clip.pause()};

/* one container: hover shows the clip, click stretches the same container open */
function mount(id,anchor){
  closeCard();const el=document.createElement("div"),ext=anchor==="stage";el.className="pop"+(ext?" ext":"");document.body.appendChild(el);
  const r0=$(`.cue[data-id="${id}"]`)?.getClientRects()[0],sr=doc.getBoundingClientRect();
  card={id,el,ext,open:false,mode:"cue",anchor:anchor||(r0?"script":"score"),right:r0?(r0.left+r0.right)/2<sr.left+sr.width/2:true,up:r0?(r0.top+r0.bottom)/2>sr.top+sr.height/2:false,
    free:false,fx:0,fy:0,dragged:false,clip:ext?stage.clip:makeClip(id),clipOn:false,hover:false,pend:[],text:"",lastT:0};
  const c=card;c.unsub=c.clip.onTime(t=>tick(c,t));
  el.addEventListener("pointerenter",()=>{c.hover=true;clearTimeout(hideT);if(!c.open)link(c.id,true)});
  el.addEventListener("pointerleave",()=>{c.hover=false;if(!c.open){link(c.id,false);peekHide()}});
  el.addEventListener("pointerdown",e=>{
    const sb=e.target.closest(".scrub");if(sb)return scrubDown(e,sb);
    if(e.button||e.target.closest("button,textarea,.thread,.draw"))return;
    const x0=e.clientX,y0=e.clientY,bb=el.getBoundingClientRect();c.dragged=false;el.setPointerCapture(e.pointerId);
    const mv=ev=>{const mx=ev.clientX-x0,my=ev.clientY-y0;if(!c.dragged&&Math.hypot(mx,my)<4)return;c.dragged=true;el.classList.add("dragging");c.free=true;c.fx=bb.left+mx;c.fy=bb.top+my;place(c)};
    const up=()=>{el.classList.remove("dragging");el.removeEventListener("pointermove",mv);el.removeEventListener("pointerup",up);el.removeEventListener("pointercancel",up);setTimeout(()=>{c.dragged=false},0)};
    el.addEventListener("pointermove",mv);el.addEventListener("pointerup",up);el.addEventListener("pointercancel",up)});
  el.addEventListener("input",e=>{if(e.target.tagName!=="TEXTAREA")return;c.text=e.target.value;autosize(e.target);mentionCheck(e.target)});
  el.addEventListener("keydown",e=>{if(e.target.tagName!=="TEXTAREA")return;
    if(mn){if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();mnMove(e.key==="ArrowDown"?1:-1);return}
      if(e.key==="Enter"||e.key==="Tab"){e.preventDefault();pickMn(mn.items[mn.i]);return}
      if(e.key==="Escape"){e.stopPropagation();hideMn();return}}
    if(e.key==="Escape"){e.stopPropagation();e.target.blur();return}
    if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}});

}
function peekShow(id){if(VIEW==="clips")return;clearTimeout(hideT);if(card&&(card.open||card.id===id))return;clearTimeout(showT);showT=setTimeout(()=>mount(id),70)}
function peekHide(){clearTimeout(showT);clearTimeout(hideT);hideT=setTimeout(()=>{if(card&&!card.open&&!card.hover)closeCard()},220)}

  card.unsub?.();if(ext)card.clip.clearLoop();else card.clip.destroy();card.el.remove();card=null;ftb.hidden=kbb.hidden=true;$$(".cm.on",tl).forEach(x=>x.classList.remove("on"));

  $$(".ci.open").forEach(c=>c.classList.remove("open"));if(CUES[id])setG(RG[id],restKey(CUES[id]),restColor)}

/* every frame the card's clip reports its time: move the playheads, show frame anchors in range, auto-pause at comments (the stage does the same for itself) */
function tick(c,t){if(card!==c||!c.ui)return;const q=CUES[c.id];
  c.ui.tc.textContent=`${tc(t)} / ${tc(q.dur)}`;if(c.ui.phd)c.ui.phd.style.left=cl(t/q.dur*100,0,100)+"%";
  const pz=c.clip.paused;if(c.ui.pp&&pz!==c.ui.pz){c.ui.pz=pz;c.ui.pp.innerHTML=pz?ICON.play:ICON.pause}
  phShow(c.id,t);
  const html=anchorsHTML(c.id,t);if(html!==c.ancHTML){c.ancHTML=html;c.ui.anc.innerHTML=html}
  if(autoPause&&c.open&&c.mode==="cue"&&!pz&&t>c.lastT&&t-c.lastT<.5){const hit=commentsOf(c.id).find(m=>m.t0>c.lastT&&m.t0<=t);
    if(hit){c.clip.pause();c.clip.seek(hit.t0);t=hit.t0;toast("Paused at a comment",snip(hit,48),hit.cat,"seed")}}
  c.lastT=t}
const avHTML=k=>`<span class="av" style="--c:var(${PEOPLE[k].c})" title="${PEOPLE[k].n} · ${PEOPLE[k].r}">${PEOPLE[k].i}</span>`;
/* frame anchors visible at time t: the open comment's always, others while the playhead is inside their range; plus the box or edge of a comment being written */

  const vis=commentsOf(id).filter(m=>(m.box||m.edge)&&(card?.cid===m.id||!writing&&t>=m.t0-.1&&t<=(m.t1??m.t0+1.5)));
  if(writing&&(card.draft.box||card.draft.edge))vis.push({id:"draft",cat:card.draft.cat,box:card.draft.box,edge:card.draft.edge});
  return vis.map(ancHTML).join("")}

    <div class="clipslot"><div class="mediaslot"></div><div class="anc"></div><div class="toolslot"></div><span class="cliptag" style="--c:var(${c})"><i></i><span class="tc"></span></span><div class="ptools">${toolsHTML()}</div></div>

/* header: what you're looking at, its state, close. Status lives in a chip whose menu only offers what your role can do */
function headHTML(){const q=CUES[card.id];let back=false,title,meta,chip;
  if(card.mode==="thread"&&COMMENTS[card.cid]){const m=COMMENTS[card.cid];back=!card.ext;title=q.n;meta=`${rangeTxt(m)} · ${CATS[m.cat]} · ${PRI[m.pri].n} priority`;chip=statusChip(m)}
  else if(card.mode==="draft"){const d=card.draft;back=!card.ext;title="Add comment";meta=`${q.n} · ${rangeTxt(d)} · ${CATS[d.cat]}`;
    chip=d.box||d.edge?`<button class="stc" data-act="noanc" title="Remove from the frame">${d.box?ICON.box:ICON.edge}${d.box?"Box":`Off-screen ${d.edge}`}${ICON.x}</button>`:`<span class="kh">B box · E off-screen</span>`}
  else{title=q.n;meta=`Scene ${q.scene} · ${CATS[q.c]} · ${fmtD(q.dur)}`;chip=cueChip(q,"data-act")}
  return `<div class="ch">${back?`<button class="btn btn-ghost btn-icon bk" data-act="back" aria-label="Back to cue">${ICON.back}</button>`:""}<div class="tt"><b>${esc(title)}</b><small>${esc(meta)}</small></div>${chip}<button class="btn btn-ghost btn-icon" data-act="close" aria-label="Close">${ICON.x}</button></div>`}
const chipHTML=(label,c,attr,acts,wait)=>acts.length?`<button class="stc" ${attr} style="--c:var(${c})" title="Change status"><i></i>${label}${ICON.down}</button>`:`<span class="stc" style="--c:var(${c})" title="${wait||""}"><i></i>${label}</span>`;
/* open → addressed (foley artist) → approved (director only) */
const statusActs=m=>ROLE==="foley"?(m.status==="open"?[["addressed","Mark addressed"]]:[]):m.status==="addressed"?[["approved","Approve"],["open","Reopen"]]:m.status==="approved"?[["open","Reopen"]]:[];
const statusChip=m=>chipHTML(STATUS[m.status].n,STATUS[m.status].c,'data-act="stmenu"',statusActs(m),ROLE==="foley"?"Waiting on the director":"Waiting on the foley artist");
/* approving a cue puts it on the foley artist's recording checklist; the foley artist ticks it off once it's recorded */
const cueActs=q=>ROLE==="director"?(q.s==="none"?[["approved","Approve cue"]]:[["none","Undo approval"]]):q.s==="approved"?[["recorded","Mark recorded"]]:q.s==="recorded"?[["approved","Not recorded yet"]]:[];
const CUEST={none:["Not approved","--muted-foreground"],approved:["To record","--props"],recorded:["Recorded","--ambience"]};
const cueChip=(q,attr)=>chipHTML(CUEST[q.s][0],CUEST[q.s][1],`${attr}="cuemenu"`,cueActs(q),"Waiting on director approval");
const cueMenu=id=>`<div class="mh">Cue</div>${cueActs(CUES[id]).map(([v,l])=>`<button data-m="cue" data-id="${id}" data-v="${v}">${ICON.check}${l}</button>`).join("")}`;
function cueHTML(){const id=card.id,q=CUES[id],cs=commentsOf(id);
  return `<button class="cnote" data-act="note" aria-expanded="${!!card.noteOpen}"><b>Director's note</b>${esc(q.d)}</button>
    <div class="clist">${cs.map(m=>`<button class="crow" data-act="thread" data-cid="${m.id}">${avHTML(m.msgs[0].by)}<span>${esc(snip(m))}</span><small><i class="dot" style="--c:var(${STATUS[m.status].c})" title="${STATUS[m.status].n}"></i>${m.t1!=null?`${tc(m.t0)}–${tc(m.t1)}`:tc(m.t0)}</small></button>`).join("")||`<p class="empty">No comments yet.</p>`}</div>
    ${composeHTML(`Comment at ${tc(card.clip.currentTime)}`)}`}
function threadHTML(){const m=COMMENTS[card.cid];return `<div class="thread">${m.msgs.map(msgHTML).join("")}</div>${composeHTML("Reply… @ to mention")}`}
function msgHTML(x,i){if(x.sys)return `<div class="msg sys">${esc(x.text)} · ${rel(x.at)}</div>`;const p=PEOPLE[x.by],rx=Object.entries(x.react||{}).filter(([,a])=>a.length);
  return `<div class="msg">${avHTML(x.by)}<div><div class="who">${p.n}<small>${p.r} · ${rel(x.at)}</small></div>${x.text?`<p>${fmtText(x.text)}</p>`:""}${(x.audio||[]).map(a=>audHTML(a)).join("")}
    ${rx.length?`<div class="rxs">${rx.map(([e,a])=>`<button class="rx" data-act="rx" data-mi="${i}" data-e="${e}" aria-pressed="${a.includes(ME())}" title="${a.map(first).join(", ")}">${e}<b>${a.length}</b></button>`).join("")}</div>`:""}</div></div>`}
function audHTML(aid,pend){const a=AUD[aid];
  return `<div class="hero sm" data-aid="${aid}" style="--c:var(--${a.cat})"><div class="wave"><div class="bars">${wave(aid,a.cat,a.peaks)}</div></div><span class="tag"><i style="background:var(--${a.cat})"></i>${KIND[a.kind]} · ${esc(a.name)}</span>
    <div class="tl"><button class="btn btn-ghost btn-icon" data-act="aplay" data-aid="${aid}" aria-label="Play ${esc(a.name)}">${ICON.play}</button>${pend?`<button class="btn btn-ghost btn-icon" data-act="unpend" data-aid="${aid}" aria-label="Remove">${ICON.x}</button>`:""}</div></div>`}
const composeHTML=ph=>`<div class="compose">${card.pend.length?`<div class="pend">${card.pend.map(a=>audHTML(a,true)).join("")}</div>`:""}
  <div class="cin">${avHTML(ME())}<textarea rows="1" placeholder="${ph}" aria-label="${ph}">${esc(card.text)}</textarea>
    ${card.rec?`<button class="btn mic rec" data-act="memo" aria-label="Stop recording">${ICON.stop}<span class="rt">0:00</span></button>`:`<button class="btn btn-ghost mic" data-act="memo" title="Voice memo" aria-label="Record a voice memo">${ICON.mic}</button>`}
    <button class="btn send" data-act="send" aria-label="Send">${ICON.send}</button></div></div>`;

/* open the card (o.anchor: "script" | "score"; o.t: seek; o.cid: open that thread; o.draft: [t0,t1] start a new comment; o.anc: {box}|{edge} for it).
   In clip view the stage is the player: seeking or picking a clip needs no card, only threads and new comments do */
function openCard(id,o={}){
  clearTimeout(showT);clearTimeout(hideT);
  if(VIEW==="clips"){stageLoad(id);if(o.t!=null)stage.clip.seek(o.t);if(!o.cid&&!o.draft){closeCard();return}}
  const anchor=VIEW==="clips"?"stage":o.anchor;
  if(!card||card.id!==id)mount(id,anchor);else if(anchor&&!card.free&&!card.ext)card.anchor=anchor;
  card.acid=o.cid||null;card.open=true;$(`.ci[data-id="${id}"]`)?.classList.add("open");setG(RG[id],"bud",`--${CUES[id].c}`);card.el.classList.add("open");revealSlot(id);
  if(o.cid)return openThread(o.cid);
  if(o.draft)return openDraft(o.draft[0],o.draft[1],o.anc);
  if(o.t!=null)card.clip.seek(o.t);
  if(card.mode!=="cue")toCue();else{render();follow(card)}
}
function toCue(){const c=card;if(c.ext)return closeCard();stopAudio();stopMemo(true);c.mode="cue";c.cid=null;c.draft=null;c.pend=[];c.text="";c.clip.clearLoop();render();follow(c)}
function openThread(cid){const c=card,m=COMMENTS[cid];stopAudio();stopMemo(true);c.mode="thread";c.cid=cid;c.draft=null;c.pend=[];c.text="";
  c.clip.seek(m.t0);if(m.t1!=null){c.clip.setLoop(m.t0,m.t1);c.clip.play()}else{c.clip.clearLoop();c.clip.pause()}
  render();follow(c)}
function openDraft(t0,t1,anc){const c=card,q=CUES[c.id];stopAudio();stopMemo(true);
  c.mode="draft";c.cid=null;c.draft={t0,t1:t1!=null&&t1-t0>=.15?t1:null,cat:q.c,pri:"med",box:anc?.box||null,edge:anc?.edge||null};c.pend=[];c.text="";
  c.clip.pause();c.clip.seek(t0);if(c.draft.t1!=null)c.clip.setLoop(t0,c.draft.t1);else c.clip.clearLoop();c.focus=true;render();follow(c)}

/* scrubber: click seeks, drag selects a range and starts a comment on it */
function scrubDown(e,s){e.preventDefault();const c=card,D=CUES[c.id].dur,r=s.getBoundingClientRect(),T=ev=>cl((ev.clientX-r.left)/r.width)*D,a=T(e),x0=e.clientX;let b=null,lp=null;s.setPointerCapture(e.pointerId);
  const mv=ev=>{if(b==null&&Math.abs(ev.clientX-x0)<4)return;b=T(ev);if(!lp){lp=document.createElement("i");lp.className="lp";s.appendChild(lp)}const lo=Math.min(a,b),hi=Math.max(a,b);lp.style.left=lo/D*100+"%";lp.style.width=(hi-lo)/D*100+"%";c.clip.seek(b)};
  const up=()=>{s.removeEventListener("pointermove",mv);s.removeEventListener("pointerup",up);s.removeEventListener("pointercancel",up);
    if(b==null||Math.abs(b-a)<.15)c.clip.seek(a);else openDraft(Math.min(a,b),Math.max(a,b),c.mode==="draft"?{box:c.draft.box,edge:c.draft.edge}:null)};
  s.addEventListener("pointermove",mv);s.addEventListener("pointerup",up);s.addEventListener("pointercancel",up)}

/* ---------- frame tools, Google Drive style: press B (or the box button) and drag on the paused frame; press E and pick an edge.
   The comment card opens beside the mark with the input focused ---------- */
const curClipId=()=>VIEW==="clips"?stage.id:card&&!card.ext?card.id:null;
const activeClip=()=>VIEW==="clips"?stage.clip:card?.clip;
const toolTarget=()=>VIEW==="clips"?$("#stTool"):card&&card.open&&!card.ext?$(".toolslot",card.el):null;

  activeClip().pause();TOOL=TOOL===k?null:k;renderTool()}

  const tgt=toolTarget();if(!tgt||!TOOL)return;const id=curClipId(),cat=card?.id===id&&card.mode==="draft"?card.draft.cat:CUES[id].c;
  tgt.innerHTML=TOOL==="box"?`<div class="draw" style="--c:var(--${cat})"><small>Drag to draw a box · Esc to cancel</small></div>`
    :`<div class="draw edges" style="--c:var(--${cat})">${Object.keys(ARROW).map(e=>`<button class="ep ${e}" data-edge="${e}" aria-label="Off-screen ${e}">${ARROW[e]}</button>`).join("")}<small>Where does the sound come from?</small></div>`}
function finishAnchor(a){const id=curClipId(),clip=activeClip();TOOL=null;renderTool();if(!id)return;
  if(card&&card.id===id&&card.mode==="draft"){Object.assign(card.draft,{box:null,edge:null},a);card.focus=true;render();follow(card)}
  else openCard(id,{draft:[clip.currentTime,null],anc:a})}
function newComment(){const id=curClipId();if(!id){toast("Open a cue first","Then press C to comment at the playhead","props","seed");return}openCard(id,{draft:[activeClip().currentTime,null]})}
/* box: drag on the frame; stored in 0–1 coordinates so it fits any player size */
function drawDown(e,dr){e.preventDefault();const r=dr.getBoundingClientRect(),P=ev=>[cl((ev.clientX-r.left)/r.width),cl((ev.clientY-r.top)/r.height)],[x0,y0]=P(e);
  const bx=document.createElement("div");bx.className="abox";dr.appendChild(bx);dr.setPointerCapture(e.pointerId);let box=null;
  const mv=ev=>{const [x,y]=P(ev);box={x:Math.min(x,x0),y:Math.min(y,y0),w:Math.abs(x-x0),h:Math.abs(y-y0)};Object.assign(bx.style,{left:box.x*100+"%",top:box.y*100+"%",width:box.w*100+"%",height:box.h*100+"%"})};
  const up=()=>{dr.removeEventListener("pointermove",mv);dr.removeEventListener("pointerup",up);dr.removeEventListener("pointercancel",up);
    if(box&&box.w>.03&&box.h>.03)finishAnchor({box});else bx.remove()};
  dr.addEventListener("pointermove",mv);dr.addEventListener("pointerup",up);dr.addEventListener("pointercancel",up)}
document.addEventListener("pointerdown",e=>{const dr=e.target.closest?.(".draw:not(.edges)");if(dr){e.stopPropagation();drawDown(e,dr)}},true);

/* everything clickable inside the open card */
function cardAct(a){const c=card,id=c.id,act=a.dataset.act,m=c.cid&&COMMENTS[c.cid];
  switch(act){
    case "close":return closeCard();
    case "pp":return c.clip.paused?c.clip.play():c.clip.pause();
    case "thread":return openThread(a.dataset.cid);
    case "back":return toCue();
    case "note":c.noteOpen=!c.noteOpen;a.setAttribute("aria-expanded",c.noteOpen);return place(c);
    case "cuemenu":return showMenu(a,cueMenu(id));
    case "stmenu":return showMenu(a,`<div class="mh">Status</div>${statusActs(m).map(([v,l])=>`<button data-m="st" data-v="${v}">${ICON.check}${l}</button>`).join("")}`);
    case "noanc":c.draft.box=c.draft.edge=null;return render();
    case "send":return send();
    case "memo":return memo();
    case "aplay":return playAud(a.dataset.aid);
    case "unpend":c.pend=c.pend.filter(x=>x!==a.dataset.aid);return render();
    case "rx":return react(+a.dataset.mi,a.dataset.e);
  }}
document.addEventListener("click",e=>{
  const path=e.composedPath(),inCard=!!card&&path.includes(card.el);
  const ep=e.target.closest(".ep");if(ep){e.stopPropagation();return finishAnchor({edge:ep.dataset.edge})}
  const pt=e.target.closest("[data-tool]");if(pt){e.stopPropagation();return pt.dataset.tool==="comment"?newComment():startTool(pt.dataset.tool)}
  if(card&&!card.open&&inCard){e.stopPropagation();if(!card.dragged)openCard(card.id);return}
  const a=e.target.closest("[data-act]");
  if(a&&inCard){cardAct(a);return}
  if(inCard)return;
  const ck=e.target.closest(".ck");
  if(ck&&list.contains(ck)){e.stopPropagation();const id=ck.closest(".ci").dataset.id,q=CUES[id];
    if(ROLE!=="foley"){toast("The foley artist checks off takes","Switch to Foley in the header",q.c,"seed");return}
    setCue(id,done(q)?"approved":"recorded");return}
  const t=e.target.closest(".cue,.ci");
  if(t&&(doc.contains(t)||list.contains(t))){e.stopPropagation();const id=t.dataset.id;
    if(VIEW==="clips"||!$(`.cue[data-id="${id}"]`))openCard(id,{anchor:"score"});
    else if(t.classList.contains("ci")&&!t.classList.contains("in")&&!t.classList.contains("open"))jumpTo(id,()=>openCard(id));else openCard(id);return}
  if(card&&card.open&&!path.some(n=>n===ftb||n===kbb||n===menu||n.tagName==="HEADER"||n.id==="ruler"||n.classList?.contains("score")||n.classList?.contains("toasts")))closeCard();
});
doc.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.classList.contains("cue"))e.target.click()});
/* shortcuts: B box, E off-screen, C comment, space play/pause; in clip view ←/→ seek (shift: a tenth), [ ] previous/next clip */
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){if(!menu.hidden)return hideMenu();if(TOOL){TOOL=null;return renderTool()}return closeCard()}
  if(e.metaKey||e.ctrlKey||e.altKey||e.target.closest?.("textarea,input,select,[contenteditable]"))return;
  const k=e.key.toLowerCase(),clip=activeClip();
  if(k==="b"||k==="e"){e.preventDefault();startTool(k==="b"?"box":"edge")}
  else if(k==="c"){e.preventDefault();newComment()}
  else if(k===" "&&clip){e.preventDefault();clip.paused?clip.play():clip.pause()}
  else if(VIEW==="clips"&&(k==="arrowleft"||k==="arrowright")){e.preventDefault();clip.pause();clip.seek(clip.currentTime+(k==="arrowleft"?-1:1)*(e.shiftKey?.1:1))}
  else if(VIEW==="clips"&&(k==="["||k==="]")){e.preventDefault();stageStep(k==="]"?1:-1)}
});
doc.addEventListener("scroll",()=>{if(card&&!card.open&&!card.hover)closeCard();else if(card)place(card)},{passive:true});
addEventListener("resize",()=>card&&place(card));

/* sync derived state after cues are added or removed. Cues made from a comment have no script phrase; they follow the cue they came from */
function sync(){const base=$$(".cue").map(c=>c.dataset.id);
  for(const id in CUES){const q=CUES[id];if(!q.virt)continue;let j=base.indexOf(q.after);if(j<0){base.push(id);continue}j++;while(j<base.length&&CUES[base[j]].virt)j++;base.splice(j,0,id)}
  order.splice(0,order.length,...base);ACTIDS.forEach((_,i)=>ACTIDS[i]=order.filter(id=>CUES[id].act===i));
  renderBar();renderScore();applyFilter();tally();refreshCounts();settleList()}
/* resolve: the phrase goes back to plain script text and the cue disappears everywhere */
function resolveCue(id){const q=CUES[id],span=$(`.cue[data-id="${id}"]`);if(!span)return;closeCard();io.unobserve(span);
  const par=span.parentNode;span.replaceWith(...span.childNodes);par.normalize();
  $(`.ci[data-id="${id}"]`).remove();delete RG[id];delete NG[id];delete CUES[id];for(const k in COMMENTS)if(COMMENTS[k].clip===id)delete COMMENTS[k];sync();toast("Cue resolved",q.n,q.c,"check")}
const ctx=document.createElement("div");ctx.className="ctx";ctx.hidden=true;ctx.innerHTML=`<button type="button"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3L13 4.5"/></svg>Resolve cue</button>`;document.body.appendChild(ctx);
let ctxId=null;const hideCtx=()=>{ctx.hidden=true;ctxId=null};
doc.addEventListener("contextmenu",e=>{const c=e.target.closest(".cue");if(!c)return;e.preventDefault();ctxId=c.dataset.id;ctx.hidden=false;
  const vw=innerWidth,vh=innerHeight;ctx.style.left=Math.min(e.clientX,vw-ctx.offsetWidth-8)+"px";ctx.style.top=Math.min(e.clientY,vh-ctx.offsetHeight-8)+"px";ctx.firstChild.focus()});
ctx.addEventListener("click",()=>{const id=ctxId;hideCtx();if(id)resolveCue(id)});
document.addEventListener("pointerdown",e=>{if(!ctx.contains(e.target))hideCtx()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")hideCtx()});
doc.addEventListener("scroll",hideCtx,{passive:true});addEventListener("resize",hideCtx);

/* ---------- highlighter: select a phrase in the script, pick a sound type, and it becomes a cue like the others ---------- */
const hl=document.createElement("div");hl.className="hl";hl.hidden=true;
hl.innerHTML=Object.keys(CATS).map(k=>`<button data-cat="${k}" style="--c:var(--${k})" title="${CATS[k]}" aria-label="Add ${CATS[k]} cue"></button>`).join("");document.body.appendChild(hl);
let hlRange=null,hlT=0,uid=0;
function checkSel(){
  const sel=getSelection();hlRange=null;hl.hidden=true;if(!sel||sel.isCollapsed||!sel.rangeCount)return;
  const r=sel.getRangeAt(0),n=r.startContainer,p=n.parentElement;
  if(n!==r.endContainer||n.nodeType!==3||!p||!p.closest(".page")||p.closest(".cue,.slug")||r.toString().trim().length<2)return;
  const b=r.getBoundingClientRect(),vw=document.documentElement.clientWidth;hlRange=r.cloneRange();hl.hidden=false;
  hl.style.left=cl(b.left+b.width/2,70,vw-70)+"px";hl.style.top=(b.top>doc.getBoundingClientRect().top+90?b.top-44:b.bottom+8)+"px"}
document.addEventListener("selectionchange",()=>{clearTimeout(hlT);hlT=setTimeout(checkSel,120)});
doc.addEventListener("scroll",()=>{hl.hidden=true},{passive:true});
hl.addEventListener("pointerdown",e=>e.preventDefault());
hl.addEventListener("click",e=>{e.stopPropagation();const b=e.target.closest("button");if(b&&hlRange)addCue(hlRange,b.dataset.cat)});
function addCue(range,cat){
  const text=range.toString().replace(/\s+/g," ").trim(),id="u"+(++uid),row=range.startContainer.parentElement.closest(".row"),all0=$$(".cue");
  let scene=1;for(let r=row;r;r=r.previousElementSibling){const n=r.querySelector(".scene-no");if(n){scene=+n.textContent;break}}
  const prev=all0.filter(c=>c.compareDocumentPosition(range.startContainer)&Node.DOCUMENT_POSITION_FOLLOWING).pop()||all0[0];
  CUES[id]={c:cat,n:text.length>34?text.slice(0,33).trimEnd()+"…":text[0].toUpperCase()+text.slice(1),s:"none",loc:CUES[prev.dataset.id].loc,d:"Added from the script. No note yet.",dur:6+hash(id)%15,scene,act:+row.closest(".act").dataset.act};
  const span=document.createElement("span");span.className="cue";span.tabIndex=0;span.dataset.id=id;span.style.setProperty("--c",`var(--${cat})`);range.surroundContents(span);

  const all=$$(".cue"),nextId=all[all.indexOf(span)+1]?.dataset.id;

  RG[id]=glyph(ci.querySelector("canvas"),"seed",{color:restColor});io.observe(span);
  sync();toast("Cue added",CUES[id].n,cat);openCard(id);
}

/* shadcn Sonner-style toast */
function toast(msg,file,cat,key="set"){const t=document.createElement("div");t.className="toast";t.innerHTML=`<canvas class="g" style="width:16px;height:16px" aria-hidden="true"></canvas><div>${msg}<small>${file}</small></div>`;
  $("#toasts").appendChild(t);glyph(t.querySelector("canvas"),key,{color:`--${cat}`,base:.08});setTimeout(()=>t.remove(),2800)}

/* ---------- comment layer: actions ---------- */
function setCue(id,s){const q=CUES[id],c=`--${q.c}`;q.s=s;
  if(s==="recorded"){setG(NG[id],"set",c);setG(RG[id],"set",c);setTimeout(()=>{NG[id]&&setG(NG[id],restKey(q),c);RG[id]&&setG(RG[id],restKey(q),restColor)},1200)}
  else{setG(NG[id],restKey(q),ok(q)?c:"--muted-foreground");setG(RG[id],restKey(q),restColor)}
  tally();applyFilter();refreshCounts();if(card&&card.id===id)render();if(stage.id===id){renderStage();renderStrip()}
  toast(s==="approved"?"Cue approved":s==="recorded"?"Marked recorded":"Back to unapproved",s==="approved"?"Added to the recording checklist":q.n,q.c,s==="recorded"?"check":"set")}
function setStatus(m,s,verb){m.status=s;m.msgs.push({sys:true,by:ME(),at:Date.now(),text:`${first(ME())} ${verb}`});
  renderScore();applyFilter();refreshCounts();card.scrollEnd=true;render();toast(`Comment ${STATUS[s].n.toLowerCase()}`,snip(m,48),m.cat,s==="approved"?"check":"set");
  const q=CUES[m.clip];if(s==="approved"&&q.s==="none"&&commentsOf(m.clip).every(x=>x.status==="approved"))setTimeout(()=>toast("Every comment on this cue is approved","Approve the cue to add it to the checklist",q.c,"seed"),400)}
function send(){const c=card,ta=$("textarea",c.el),text=(ta?.value||"").trim();
  if(c.rec){toast("Finish the voice memo first","Tap the red button to stop",CUES[c.id].c,"seed");return}
  if(!text&&!c.pend.length){ta?.focus();return}

    if(hit){stage.clip.pause();stage.clip.seek(hit.t0);t=hit.t0;toast("Paused at a comment",snip(hit,48),hit.cat,"seed")}}
  stage.lastT=t}
$("#view").addEventListener("click",e=>{const b=e.target.closest("[data-view]");if(b&&b.dataset.view!==VIEW)setView(b.dataset.view)});
$("#stage").addEventListener("click",e=>{const b=e.target.closest("[data-sact]");if(!b)return;e.stopPropagation();const k=b.dataset.sact,id=stage.id;
  if(k==="pp")stage.clip.paused?stage.clip.play():stage.clip.pause();
  else if(k==="prev"||k==="next")stageStep(k==="next"?1:-1);
  else if(k==="clip")stageLoad(b.dataset.id);
  else if(k==="cm")openCard(id,{cid:b.dataset.cid});
  else if(k==="cuemenu")showMenu(b,cueMenu(id));
  else if(k==="clipup"){clipIn._id=id;clipIn.click()}});
/* ruler: click to seek, drag to select a range and comment on it */
$("#ruler").addEventListener("pointerdown",e=>{if(e.button||e.target.closest(".rb"))return;e.preventDefault();const R=e.currentTarget,r=R.getBoundingClientRect(),D=CUES[stage.id].dur,
  T=ev=>cl((ev.clientX-r.left)/r.width)*D,a=T(e),x0=e.clientX,sel=$(".rsel",R);let b=null;R.setPointerCapture(e.pointerId);stage.clip.seek(a);
  const mv=ev=>{if(b==null&&Math.abs(ev.clientX-x0)<4)return;b=T(ev);const lo=Math.min(a,b),hi=Math.max(a,b);sel.hidden=false;sel.style.left=lo/D*100+"%";sel.style.width=(hi-lo)/D*100+"%";stage.clip.seek(b)};
  const up=()=>{R.removeEventListener("pointermove",mv);R.removeEventListener("pointerup",up);R.removeEventListener("pointercancel",up);sel.hidden=true;
    if(b!=null&&Math.abs(b-a)>=.15)openCard(stage.id,{draft:[Math.min(a,b),Math.max(a,b)]})};
  R.addEventListener("pointermove",mv);R.addEventListener("pointerup",up);R.addEventListener("pointercancel",up)});
/* the player keeps 16:9 inside whatever room the pane leaves it */
function fitPlayer(){const w=$(".st-p"),p=$("#player"),r=w.getBoundingClientRect();if(!r.width)return;const pw=Math.min(r.width,r.height*16/9);p.style.width=pw+"px";p.style.height=pw*9/16+"px";if(card?.ext)place(card)}
new ResizeObserver(fitPlayer).observe($(".st-p"));
$("#player .ptools").innerHTML=toolsHTML();
$('[data-sact="prev"]').innerHTML=ICON.back;$('[data-sact="next"]').innerHTML=ICON.next;

/* role toggle: the director approves comments and cues, the foley artist addresses comments and checks off recorded cues */
function renderRole(){$("#role").innerHTML=[["director","Director"],["foley","Foley"]].map(([k,n])=>`<button class="tg" data-role="${k}" aria-pressed="${ROLE===k}">${n}</button>`).join("")}
$("#role").addEventListener("click",e=>{const b=e.target.closest("[data-role]");if(!b||b.dataset.role===ROLE)return;ROLE=b.dataset.role;try{localStorage.setItem("svsd-role",ROLE)}catch(e){}
  renderRole();if(card){hideMenu();render()}toast(`Viewing as ${PEOPLE[ME()].r.toLowerCase()}`,PEOPLE[ME()].n,"score","seed")});

renderPri();renderRole();applyFilter();refreshCounts();tally();setView(VIEW);
